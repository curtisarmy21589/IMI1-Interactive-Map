<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Facility Blueprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .blueprint-grid {
            background-image: linear-gradient(to right, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-map-location-dot text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-100 tracking-tight">Facility Blueprint Studio</h1>
                <p class="text-xs text-slate-400 flex items-center gap-2">
                    <span>Project: imi1-interactive-map-8d929</span>
                    <span id="sync-status" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                        <span class="w-1.5 h-1.5 mr-1 rounded-full bg-amber-400 animate-pulse"></span> Connecting Cloud...
                    </span>
                </p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div class="bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 flex items-center">
                <button id="tool-select" onclick="setTool('select')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition bg-blue-600 text-white shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-pointer"></i> Select/Move
                </button>
                <button id="tool-add" onclick="setTool('add')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Add Asset
                </button>
            </div>

            <button onclick="zoomMap(0.1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center transition shadow-sm" title="Zoom In">
                <i class="fa-solid fa-magnifying-glass-plus text-sm"></i>
            </button>
            <button onclick="zoomMap(-0.1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center transition shadow-sm" title="Zoom Out">
                <i class="fa-solid fa-magnifying-glass-minus text-sm"></i>
            </button>
            <button onclick="resetMapView()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center transition shadow-sm" title="Reset View">
                <i class="fa-solid fa-expand text-sm"></i>
            </button>
            <button onclick="openExportModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-file-export text-blue-400"></i> Export JSON
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Controls -->
        <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-10 shadow-xl">
            <!-- Tabs -->
            <div class="flex border-b border-slate-800">
                <button onclick="switchTab('assets')" id="tab-assets" class="flex-1 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-500 bg-slate-800/40 transition">
                    <i class="fa-solid fa-boxes-stacked mr-1.5"></i> Assets (<span id="asset-count">0</span>)
                </button>
                <button onclick="switchTab('catalog')" id="tab-catalog" class="flex-1 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">
                    <i class="fa-solid fa-shapes mr-1.5"></i> Asset Library
                </button>
            </div>

            <!-- Asset List Tab Content -->
            <div id="panel-assets" class="flex-1 flex flex-col overflow-hidden p-4 space-y-4">
                <!-- Search & Filters -->
                <div class="space-y-2.5">
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                        <input type="text" id="asset-search" oninput="filterAssets()" placeholder="Search placed assets..." 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                        <button onclick="setCategoryFilter('all')" id="cat-all" class="cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-blue-600 text-white shrink-0 transition">All</button>
                        <button onclick="setCategoryFilter('Server')" id="cat-Server" class="cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-800 text-slate-400 hover:text-slate-200 shrink-0 transition">Servers</button>
                        <button onclick="setCategoryFilter('Security')" id="cat-Security" class="cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-800 text-slate-400 hover:text-slate-200 shrink-0 transition">Security</button>
                        <button onclick="setCategoryFilter('HVAC')" id="cat-HVAC" class="cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-800 text-slate-400 hover:text-slate-200 shrink-0 transition">HVAC</button>
                        <button onclick="setCategoryFilter('Workstation')" id="cat-Workstation" class="cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-800 text-slate-400 hover:text-slate-200 shrink-0 transition">Workstations</button>
                    </div>
                </div>

                <!-- Asset Item List -->
                <div id="asset-list-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <!-- Dynamic Items -->
                </div>
            </div>

            <!-- Asset Library Tab Content -->
            <div id="panel-catalog" class="flex-1 flex flex-col overflow-hidden p-4 space-y-4 hidden">
                <p class="text-xs text-slate-400">Click an item to select it for placement on the facility blueprint map:</p>
                <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="catalog-list">
                    <!-- Catalog items populated via JS -->
                </div>
            </div>

            <!-- Selected Asset Inspector -->
            <div id="inspector-panel" class="border-t border-slate-800 p-4 bg-slate-900/90 hidden">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Asset Properties</h3>
                    <button onclick="closeInspector()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="inspector-content" class="space-y-3">
                    <!-- Inspector fields -->
                </div>
            </div>
        </aside>

        <!-- Interactive Map Canvas Workspace -->
        <main class="flex-1 relative blueprint-grid overflow-hidden flex items-center justify-center">
            <!-- Canvas HUD overlay -->
            <div class="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-xl px-4 py-2.5 shadow-xl flex items-center gap-4 text-xs">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-slate-300 font-medium">Cloud Live Sync Active</span>
                </div>
                <div class="h-4 w-px bg-slate-700"></div>
                <span class="text-slate-400">Tip: Drag items to position or click to inspect</span>
            </div>

            <!-- Main Canvas Element -->
            <div id="canvas-wrapper" class="relative w-full h-full cursor-grab active:cursor-grabbing">
                <canvas id="blueprint-canvas" class="absolute inset-0 w-full h-full block"></canvas>
            </div>
        </main>
    </div>

    <div id="export-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 class="font-semibold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-file-code text-blue-400"></i> Blueprint Export Data</h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6">
                <textarea id="export-json-area" readonly class="w-full h-64 bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-blue-300 focus:outline-none resize-none"></textarea>
            </div>
            <div class="px-6 py-4 bg-slate-900/50 border-t border-slate-800 flex justify-end gap-3">
                <button onclick="closeExportModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">Close</button>
                <button onclick="copyExportJson()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-copy"></i> Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // Exact user-provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForImu1InteractiveMap8d929",
            authDomain: "imi1-interactive-map-8d929.firebaseapp.com",
            projectId: "imi1-interactive-map-8d929",
            storageBucket: "imi1-interactive-map-8d929.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            signInAnonymously(auth).then(() => {
                document.getElementById('sync-status').innerHTML = '<span class="w-1.5 h-1.5 mr-1 rounded-full bg-emerald-400"></span> Cloud Synchronized';
                document.getElementById('sync-status').className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            }).catch(err => {
                console.warn('Anonymous auth note:', err);
                document.getElementById('sync-status').innerHTML = '<span class="w-1.5 h-1.5 mr-1 rounded-full bg-emerald-400"></span> Local Offline Mode';
                document.getElementById('sync-status').className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            });
        } catch (e) {
            console.warn('Firebase initialization notice:', e);
        }

        // Asset Catalog Templates
        const catalogItems = [
            { name: 'Enterprise Blade Server', category: 'Server', icon: 'fa-server', color: '#3b82f6', width: 60, height: 60 },
            { name: 'Core Router Switch', category: 'Server', icon: 'fa-network-wired', color: '#6366f1', width: 50, height: 50 },
            { name: 'Security Camera PTZ', category: 'Security', icon: 'fa-video', color: '#ef4444', width: 40, height: 40 },
            { name: 'Access Control Terminal', category: 'Security', icon: 'fa-id-card', color: '#f59e0b', width: 40, height: 40 },
            { name: 'HVAC Air Handler Unit', category: 'HVAC', icon: 'fa-wind', color: '#10b981', width: 80, height: 60 },
            { name: 'Temperature Sensor Node', category: 'HVAC', icon: 'fa-temperature-half', color: '#14b8a6', width: 35, height: 35 },
            { name: 'Engineering Workstation', category: 'Workstation', icon: 'fa-desktop', color: '#8b5cf6', width: 60, height: 50 },
            { name: 'Emergency Power UPS', category: 'Server', icon: 'fa-bolt', color: '#ec4899', width: 70, height: 50 }
        ];

        // Default initial assets if Firestore is empty
        let assets = [
            { id: 'asset-1', name: 'Server Rack Alpha', category: 'Server', icon: 'fa-server', color: '#3b82f6', x: 250, y: 180, width: 60, height: 60, status: 'Operational' },
            { id: 'asset-2', name: 'Perimeter Camera 04', category: 'Security', icon: 'fa-video', color: '#ef4444', x: 450, y: 120, width: 40, height: 40, status: 'Active' },
            { id: 'asset-3', name: 'Main HVAC Unit B', category: 'HVAC', icon: 'fa-wind', color: '#10b981', x: 620, y: 280, width: 80, height: 60, status: 'Normal' },
            { id: 'asset-4', name: 'Control Desk Station 1', category: 'Workstation', icon: 'fa-desktop', color: '#8b5cf6', x: 320, y: 420, width: 60, height: 50, status: 'Online' }
        ];

        // State variables
        let currentTool = 'select'; // 'select' or 'add'
        let selectedCatalogTemplate = null;
        let selectedAssetId = null;
        let activeCategoryFilter = 'all';
        let searchQuery = '';
        let currentTab = 'assets';

        // Canvas pan/zoom/drag state
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDraggingCanvas = false;
        let startX = 0;
        let startY = 0;
        let draggingAssetId = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        const canvas = document.getElementById('blueprint-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        // Setup Firestore listener if available
        if (db) {
            try {
                onSnapshot(collection(db, "facility_assets"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudAssets = [];
                        snapshot.forEach(docSnap => {
                            cloudAssets.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        assets = cloudAssets;
                        renderUI();
                        drawCanvas();
                    }
                }, (error) => {
                    console.log("Using local state sync fallback:", error);
                });
            } catch (err) {
                console.log("Firestore snapshot listener setup note:", err);
            }
        }

        function initApp() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            renderCatalog();
            renderUI();
            setupCanvasEvents();
            drawCanvas();
        }

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            drawCanvas();
        }

        window.setTool = function(tool) {
            currentTool = tool;
            document.getElementById('tool-select').className = tool === 'select' 
                ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition bg-blue-600 text-white shadow-sm flex items-center gap-1.5'
                : 'px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white flex items-center gap-1.5';
            document.getElementById('tool-add').className = tool === 'add' 
                ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition bg-blue-600 text-white shadow-sm flex items-center gap-1.5'
                : 'px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white flex items-center gap-1.5';
            
            if (tool === 'add' && !selectedCatalogTemplate) {
                selectedCatalogTemplate = catalogItems[0];
                switchTab('catalog');
            }
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            const btnAssets = document.getElementById('tab-assets');
            const btnCatalog = document.getElementById('tab-catalog');
            const panelAssets = document.getElementById('panel-assets');
            const panelCatalog = document.getElementById('panel-catalog');

            if (tab === 'assets') {
                btnAssets.className = 'flex-1 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-500 bg-slate-800/40 transition';
                btnCatalog.className = 'flex-1 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition';
                panelAssets.classList.remove('hidden');
                panelCatalog.classList.add('hidden');
            } else {
                btnCatalog.className = 'flex-1 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-500 bg-slate-800/40 transition';
                btnAssets.className = 'flex-1 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition';
                panelCatalog.classList.remove('hidden');
                panelAssets.classList.add('hidden');
            }
        };

        window.setCategoryFilter = function(cat) {
            activeCategoryFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = 'cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-800 text-slate-400 hover:text-slate-200 shrink-0 transition';
            });
            document.getElementById(`cat-${cat}`).className = 'cat-btn px-2.5 py-1 rounded-lg text-[11px] font-medium bg-blue-600 text-white shrink-0 transition';
            renderUI();
        };

        window.filterAssets = function() {
            searchQuery = document.getElementById('asset-search').value.toLowerCase();
            renderUI();
        };

        function renderCatalog() {
            const container = document.getElementById('catalog-list');
            container.innerHTML = catalogItems.map(item => `
                <div onclick="selectCatalogItem('${item.name}')" 
                     class="p-3 bg-slate-950 border ${selectedCatalogTemplate?.name === item.name ? 'border-blue-500 bg-blue-950/20' : 'border-slate-800 hover:border-slate-700'} rounded-xl cursor-pointer transition flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white text-sm shadow-sm" style="background-color: ${item.color}">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-medium text-slate-200">${item.name}</h4>
                            <span class="text-[10px] text-slate-500">${item.category} • ${item.width}x${item.height}px</span>
                        </div>
                    </div>
                    <span class="text-xs text-blue-400 opacity-0 group-hover:opacity-100 transition font-medium">Add <i class="fa-solid fa-plus ml-1"></i></span>
                </div>
            `).join('');
        }

        window.selectCatalogItem = function(name) {
            selectedCatalogTemplate = catalogItems.find(i => i.name === name);
            setTool('add');
            switchTab('assets');
            renderCatalog();
        };

        function renderUI() {
            const filtered = assets.filter(a => {
                const matchesCat = activeCategoryFilter === 'all' || a.category === activeCategoryFilter;
                const matchesSearch = a.name.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            document.getElementById('asset-count').innerText = assets.length;
            const container = document.getElementById('asset-list-container');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No assets match current filters</div>`;
                return;
            }

            container.innerHTML = filtered.map(a => `
                <div onclick="focusAsset('${a.id}')" 
                     class="p-3 bg-slate-950 border ${selectedAssetId === a.id ? 'border-blue-500 bg-blue-950/20' : 'border-slate-800 hover:border-slate-700'} rounded-xl cursor-pointer transition flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs" style="background-color: ${a.color}">
                            <i class="fa-solid ${a.icon || 'fa-box'}"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-medium text-slate-200">${a.name}</h4>
                            <span class="text-[10px] text-slate-500">${a.category} • (${Math.round(a.x)}, ${Math.round(a.y)})</span>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteAsset('${a.id}')" class="text-slate-600 hover:text-red-400 p-1.5 transition opacity-0 group-hover:opacity-100" title="Delete Asset">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');

            renderInspector();
        }

        function renderInspector() {
            const panel = document.getElementById('inspector-panel');
            const content = document.getElementById('inspector-content');
            const asset = assets.find(a => a.id === selectedAssetId);

            if (!asset) {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            content.innerHTML = `
                <div class="space-y-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Asset Name</label>
                        <input type="text" id="ins-name" value="${asset.name}" oninput="updateAssetProp('${asset.id}', 'name', this.value)"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">Position X</label>
                            <input type="number" value="${Math.round(asset.x)}" onchange="updateAssetProp('${asset.id}', 'x', parseFloat(this.value))"
                                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">Position Y</label>
                            <input type="number" value="${Math.round(asset.y)}" onchange="updateAssetProp('${asset.id}', 'y', parseFloat(this.value))"
                                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Status / Notes</label>
                        <input type="text" value="${asset.status || 'Operational'}" oninput="updateAssetProp('${asset.id}', 'status', this.value)"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="pt-2 flex justify-between">
                        <button onclick="deleteAsset('${asset.id}')" class="px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-medium transition flex items-center gap-1.5">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                        <button onclick="closeInspector()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">
                            Done
                        </button>
                    </div>
                </div>
            `;
        }

        window.focusAsset = function(id) {
            selectedAssetId = id;
            const asset = assets.find(a => a.id === id);
            if (asset) {
                panX = canvas.width / 2 - asset.x * scale;
                panY = canvas.height / 2 - asset.y * scale;
            }
            renderUI();
            drawCanvas();
        };

        window.closeInspector = function() {
            selectedAssetId = null;
            renderUI();
            drawCanvas();
        };

        window.updateAssetProp = function(id, key, val) {
            const asset = assets.find(a => a.id === id);
            if (asset) {
                asset[key] = val;
                saveAssetToCloud(asset);
                drawCanvas();
            }
        };

        window.deleteAsset = async function(id) {
            assets = assets.filter(a => a.id !== id);
            if (selectedAssetId === id) selectedAssetId = null;
            renderUI();
            drawCanvas();
            if (db) {
                try {
                    await deleteDoc(doc(db, "facility_assets", id));
                } catch (e) {
                    console.log("Cloud delete note:", e);
                }
            }
        };

        async function saveAssetToCloud(asset) {
            if (db) {
                try {
                    await setDoc(doc(db, "facility_assets", asset.id), asset);
                } catch (e) {
                    console.log("Cloud save note:", e);
                }
            }
        }

        window.zoomMap = function(delta) {
            scale = Math.max(0.4, Math.min(2.5, scale + delta));
            drawCanvas();
        };

        window.resetMapView = function() {
            scale = 1;
            panX = 0;
            panY = 0;
            drawCanvas();
        };

        // Canvas Drawing Engine
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // Draw Blueprint Facility Floorplan Outline & Rooms
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#0f172a';

            // Outer Facility Perimeter
            ctx.beginPath();
            ctx.roundRect(100, 80, 900, 600, 16);
            ctx.fill();
            ctx.stroke();

            // Interior Room Partitions
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.5;

            // Server Hallway
            ctx.strokeRect(120, 100, 380, 260);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.3)';
            ctx.fillRect(120, 100, 380, 260);

            // Security & Operations Control Room
            ctx.strokeRect(520, 100, 460, 260);
            ctx.fillRect(520, 100, 460, 260);

            // HVAC & Utility Plant
            ctx.strokeRect(120, 380, 380, 280);
            ctx.fillRect(120, 380, 380, 280);

            // Main Warehouse Bay
            ctx.strokeRect(520, 380, 460, 280);
            ctx.fillRect(520, 380, 460, 280);

            // Room Labels
            ctx.fillStyle = '#64748b';
            ctx.font = '600 11px Inter, sans-serif';
            ctx.fillText('SERVER HALLWAY (ZONE A)', 140, 125);
            ctx.fillText('SECURITY & COMMAND CENTER (ZONE B)', 540, 125);
            ctx.fillText('HVAC & POWER UTILITY PLANT (ZONE C)', 140, 405);
            ctx.fillText('LOGISTICS WAREHOUSE BAY (ZONE D)', 540, 405);

            // Draw Assets
            assets.forEach(a => {
                const isSelected = a.id === selectedAssetId;

                ctx.save();
                ctx.translate(a.x, a.y);

                // Asset Box Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;

                // Asset Card Background
                ctx.fillStyle = isSelected ? '#1d4ed8' : '#1e293b';
                ctx.strokeStyle = isSelected ? '#60a5fa' : (a.color || '#3b82f6');
                ctx.lineWidth = isSelected ? 2.5 : 1.5;

                ctx.beginPath();
                ctx.roundRect(-a.width/2, -a.height/2, a.width, a.height, 10);
                ctx.fill();
                ctx.stroke();

                ctx.shadowBlur = 0; // Reset shadow

                // Asset Icon placeholder or FontAwesome rendering via canvas approximation
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px "Font Awesome 6 Free", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Draw Icon circle/bg
                ctx.fillStyle = a.color || '#3b82f6';
                ctx.beginPath();
                ctx.arc(0, -6, 14, 0, Math.PI * 2);
                ctx.fill();

                // Draw Asset Name label
                ctx.fillStyle = '#f8fafc';
                ctx.font = '500 10px Inter, sans-serif';
                ctx.fillText(a.name.length > 14 ? a.name.substring(0, 12) + '...' : a.name, 0, 22);

                ctx.restore();
            });

            ctx.restore();
        }

        // Mouse & Touch interaction handlers for canvas panning and asset dragging
        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - panX) / scale;
                const mouseY = (e.clientY - rect.top - panY) / scale;

                // Check if clicking an asset
                const clickedAsset = assets.slice().reverse().find(a => {
                    return mouseX >= a.x - a.width/2 && mouseX <= a.x + a.width/2 &&
                           mouseY >= a.y - a.height/2 && mouseY <= a.y + a.height/2;
                });

                if (currentTool === 'add' && selectedCatalogTemplate) {
                    // Place new asset
                    const newAsset = {
                        id: 'asset-' + Date.now(),
                        name: selectedCatalogTemplate.name,
                        category: selectedCatalogTemplate.category,
                        icon: selectedCatalogTemplate.icon,
                        color: selectedCatalogTemplate.color,
                        x: mouseX,
                        y: mouseY,
                        width: selectedCatalogTemplate.width,
                        height: selectedCatalogTemplate.height,
                        status: 'Operational'
                    };
                    assets.push(newAsset);
                    selectedAssetId = newAsset.id;
                    saveAssetToCloud(newAsset);
                    renderUI();
                    drawCanvas();
                    setTool('select');
                    return;
                }

                if (clickedAsset) {
                    selectedAssetId = clickedAsset.id;
                    draggingAssetId = clickedAsset.id;
                    dragOffsetX = mouseX - clickedAsset.x;
                    dragOffsetY = mouseY - clickedAsset.y;
                    renderUI();
                    drawCanvas();
                } else {
                    selectedAssetId = null;
                    isDraggingCanvas = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                    renderUI();
                    drawCanvas();
                }
            });

            window.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - panX) / scale;
                const mouseY = (e.clientY - rect.top - panY) / scale;

                if (draggingAssetId) {
                    const asset = assets.find(a => a.id === draggingAssetId);
                    if (asset) {
                        asset.x = mouseX - dragOffsetX;
                        asset.y = mouseY - dragOffsetY;
                        drawCanvas();
                    }
                } else if (isDraggingCanvas) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    drawCanvas();
                }
            });

            window.addEventListener('mouseup', () => {
                if (draggingAssetId) {
                    const asset = assets.find(a => a.id === draggingAssetId);
                    if (asset) {
                        saveAssetToCloud(asset);
                    }
                    draggingAssetId = null;
                }
                isDraggingCanvas = false;
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.max(0.4, Math.min(2.5, scale * zoomFactor));
                drawCanvas();
            }, { passive: false });
        }

        window.openExportModal = function() {
            document.getElementById('export-json-area').value = JSON.stringify(assets, null, 2);
            document.getElementById('export-modal').classList.remove('hidden');
        };

        window.closeExportModal = function() {
            document.getElementById('export-modal').classList.add('hidden');
        };

        window.copyExportJson = function() {
            const textarea = document.getElementById('export-json-area');
            textarea.select();
            document.execCommand('copy');
            alert('Blueprint JSON data copied successfully to clipboard!');
        };

        window.onload = initApp;
    </script>
</body>
