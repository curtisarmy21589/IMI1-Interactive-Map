<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout Viewer - View Only</title>
    <style>
        body {
            background-color: #0b131d;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #111b27;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #1f2d3d;
        }
        h2, h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 15px; }
        label { font-size: 11px; color: #94a3b8; }
        input, select, button, textarea {
            width: 100%;
            padding: 6px 8px;
            background: #0b131d;
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 2px;
            font-size: 12px;
        }
        textarea { resize: vertical; height: 60px; font-family: sans-serif; }
        button {
            background: #1e293b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #38bdf8; color: #0b131d; }
        .layer-btn {
            flex: 1;
            padding: 6px 4px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        .layer-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            font-weight: bold;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #070d14;
            overflow: hidden;
            cursor: grab;
        }
        #canvas-container.panning { cursor: grabbing; }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        .item-group {
            cursor: pointer;
        }
        .item-shape {
            transition: stroke 0.2s;
        }
        .item-group:hover .item-shape { stroke: #fff; }
        /* HOVER POPUP BUBBLE STYLES */
        .asset-popup {
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
        }
        .item-group:hover .asset-popup {
            opacity: 1;
        }
        .grid-line {
            stroke: #132235;
            stroke-width: 1;
            pointer-events: none;
        }
        .coord-label {
            fill: #64748b;
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
        }
        #coord-display {
            background: #070d14;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            text-align: center;
        }
        #sync-status {
            font-size: 10px;
            text-align: center;
            color: #10b981;
            font-weight: bold;
            margin-top: -4px;
        }
        /* MODAL STYLES */
        #modal-overlay, #lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #lightbox-overlay {
            z-index: 2000;
        }
        .modal-content {
            background: #111b27;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .modal-header {
            background: #0b131d;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2d3d;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-footer {
            background: #0b131d;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #1f2d3d;
        }
        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .close-modal:hover { color: #fff; background: none; }
        
        /* SPREADSHEET TABLE */
        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .spreadsheet-table th, .spreadsheet-table td {
            border: 1px solid #1f2d3d;
            padding: 6px;
            text-align: left;
            font-size: 11px;
        }
        .spreadsheet-table th {
            background: #0b131d;
            color: #38bdf8;
        }
        .spreadsheet-table input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            padding: 2px;
            margin: 0;
        }
        /* PHOTO GRID */
        .photo-gallery {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .photo-thumb-container {
            position: relative;
            width: 90px;
            height: 90px;
            border: 1px solid #1f2d3d;
            border-radius: 4px;
            overflow: hidden;
            background: #0b131d;
            cursor: pointer;
        }
        .photo-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .photo-thumb-container:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Facility Viewer (View Only)</h2>
        
        <div id="coord-display">Col: -- | Row: --</div>
        <div id="sync-status">Connected (View Only)</div>
        
        <!-- LAYER SELECTION MENU -->
        <div>
            <label>Active View Layer</label>
            <div style="display: flex; gap: 4px; margin-top: 2px;">
                <button class="layer-btn active" id="layerGroundBtn" onclick="switchLayer('ground')">Ground Floor</button>
                <button class="layer-btn" id="layerMezzBtn" onclick="switchLayer('mezzanine')">Mezz Floor</button>
                <button class="layer-btn" id="layerRoofBtn" onclick="switchLayer('roof')">Roof Layer</button>
            </div>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="layer-btn" id="layerSprinklerBtn" onclick="switchLayer('sprinkler')">Sprinkler Shutoffs</button>
                <button class="layer-btn" id="layerWaterBtn" onclick="switchLayer('water')">Water Shutoffs</button>
                <button class="layer-btn" id="layerGasBtn" onclick="switchLayer('gas')">Gas Shutoffs</button>
            </div>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="layer-btn" id="layerDockDoorsBtn" onclick="switchLayer('dock_doors')">Dock Doors</button>
                <button class="layer-btn" id="layerUnderMezzSprinklersBtn" onclick="switchLayer('under_mezz_sprinklers')">Under Mezz Sprinklers</button>
            </div>
        </div>

        <div>
            <p style="font-size: 10px; color: #64748b; margin: 10px 0 0 0;">
                💡 <b>Tip:</b> Click any asset or zone on the map to inspect its info, custom parameters, and photos[cite: 2]. Use your mouse to pan and zoom.
            </p>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="layoutSvg" width="2200" height="1400">
            <g id="viewport">
                <!-- Rendered dynamically -->
            </g>
        </svg>
    </div>

    <!-- ITEM DETAILS & PHOTO MODAL -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #38bdf8; margin: 0;">Item Details</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalElementId">
                
                <div>
                    <label>Item Name / Designation</label>
                    <input type="text" id="modalName" disabled>
                </div>
                
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col</label><input type="number" id="modalX" disabled></div>
                    <div style="flex:1;"><label>Y Row</label><input type="number" id="modalY" disabled></div>
                </div>
                
                <div>
                    <label>Location Photos (Click photo to enlarge)</label>
                    <div class="photo-gallery" id="modalPhotoGallery">
                        <!-- Photos render here -->
                    </div>
                </div>

                <div>
                    <label>Spreadsheet Details / Custom Records</label>
                    <table class="spreadsheet-table">
                        <thead>
                            <tr>
                                <th style="width: 40%;">Parameter / Field</th>
                                <th style="width: 60%;">Value / Data</th>
                            </tr>
                        </thead>
                        <tbody id="spreadsheetBody">
                            <!-- Records render here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Close</button>
            </div>
        </div>
    </div>

    <!-- FULL-SIZE PHOTO LIGHTBOX OVERLAY -->
    <div id="lightbox-overlay" onclick="closeLightbox()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" style="position: absolute; top: -35px; right: 0; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">×</button>
            <img id="lightboxImage" src="" style="max-width: 85vw; max-height: 80vh; object-fit: contain; border-radius: 4px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
            <div id="lightboxCaption" style="margin-top: 8px; color: #38bdf8; font-size: 13px; font-weight: bold;"></div>
        </div>
    </div>
