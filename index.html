<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout & Site Builder - Pan/Zoom Inspect & Spreadsheet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b131d">

    <style>
        body {
            background-color: #0b131d;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #sidebar {
            width: 340px;
            background-color: #111b27;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #1f2d3d;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        h2, h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 15px; }
        label { font-size: 11px; color: #94a3b8; }
        input, select, button, textarea {
            width: 100%;
            padding: 6px 8px;
            background: #0b131d;
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 2px;
            font-size: 12px;
        }
        textarea { resize: vertical; height: 60px; font-family: sans-serif; }
        button {
            background: #1e293b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
        }
        button:hover { background: #38bdf8; color: #0b131d; }
        .mode-btn {
            background: #070d14;
            border: 2px solid #1e293b;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0b131d;
            border-color: #fff;
        }
        .layer-btn {
            flex: 1;
            padding: 6px 4px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        .layer-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            font-weight: bold;
        }
        .danger { background: #7f1d1d; border-color: #ef4444; }
        .danger:hover { background: #ef4444; color: #fff; }
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-color: #38bdf8;
        }
        .panel { display: none; }
        .panel.active { display: flex; flex-direction: column; gap: 8px; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #070d14;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        #canvas-container.panning { cursor: grabbing; }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            touch-action: none;
        }
        .item-group {
            cursor: pointer;
            touch-action: none;
        }
        .item-shape {
            transition: stroke 0.2s;
        }
        .item-group:hover .item-shape { stroke: #fff; }
        .item-shape.selected {
            stroke: #fbbf24;
            stroke-width: 3;
        }
        .asset-popup {
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
        }
        .item-group:hover .asset-popup {
            opacity: 1;
        }
        .grid-line {
            stroke: #132235;
            stroke-width: 1;
            pointer-events: none;
        }
        .coord-label {
            fill: #64748b;
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
        }
        #coord-display {
            background: #070d14;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            text-align: center;
        }
        #sync-status {
            font-size: 10px;
            text-align: center;
            color: #10b981;
            font-weight: bold;
            margin-top: -4px;
        }
        #modal-overlay, #category-modal-overlay, #lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            touch-action: auto;
        }
        #lightbox-overlay {
            z-index: 2000;
        }
        .modal-content {
            background: #111b27;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            width: 600px;
            max-width: 92vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            overflow: hidden;
            touch-action: pan-y;
        }
        .modal-header {
            background: #0b131d;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2d3d;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }
        .modal-footer {
            background: #0b131d;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #1f2d3d;
        }
        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .close-modal:hover { color: #fff; background: none; }
        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .spreadsheet-table th, .spreadsheet-table td {
            border: 1px solid #1f2d3d;
            padding: 6px;
            text-align: left;
            font-size: 11px;
        }
        .spreadsheet-table th {
            background: #0b131d;
            color: #38bdf8;
        }
        .spreadsheet-table input, .spreadsheet-table select {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            padding: 2px;
            margin: 0;
        }
        .spreadsheet-table input:focus, .spreadsheet-table select:focus { outline: 1px solid #38bdf8; }
        .photo-gallery {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .photo-thumb-container {
            position: relative;
            width: 90px;
            height: 90px;
            border: 1px solid #1f2d3d;
            border-radius: 4px;
            overflow: hidden;
            background: #0b131d;
            cursor: pointer;
        }
        .photo-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .photo-thumb-container:hover img {
            transform: scale(1.05);
        }
        .delete-photo-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            z-index: 5;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar {
                width: 100%;
                height: auto;
                max-height: 35vh;
                box-sizing: border-box;
            }
            #canvas-container { height: 65vh; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Site & Layout Builder</h2>
        
        <div id="coord-display">Col: -- | Row: --</div>
        <div id="sync-status">Connected to Firebase</div>

        <!-- ENHANCEMENT 1: SEARCH BAR -->
        <div>
            <label>🔍 Quick Asset Search & Jump</label>
            <input type="text" id="assetSearchInput" placeholder="Type asset or zone name..." oninput="filterSearchAssets()" autocomplete="off">
            <div id="searchResultsList" style="max-height: 110px; overflow-y: auto; background: #070d14; border: 1px solid #1f2d3d; border-radius: 4px; margin-top: 2px; display: none;"></div>
        </div>

        <!-- ENHANCEMENT 6: EMERGENCY QUICK SHORTCUTS -->
        <div>
            <label style="color: #ef4444; font-weight: bold;">🚨 Emergency Quick Filters</label>
            <div style="display: flex; gap: 4px; margin-top: 2px;">
                <button onclick="filterEmergencyCategory('Fire Safety')" style="background: #7f1d1d; border-color: #ef4444; font-size: 10px; padding: 4px;">Fire Hydrants</button>
                <button onclick="filterEmergencyCategory('Plumbing')" style="background: #0369a1; border-color: #38bdf8; font-size: 10px; padding: 4px;">Water Valves</button>
                <button onclick="filterEmergencyCategory('Electrical')" style="background: #c2410c; border-color: #f97316; font-size: 10px; padding: 4px;">Electrical MDP</button>
            </div>
        </div>

        <!-- LAYER SELECTION MENU -->
        <div>
            <label>Active View Layer</label>
            <div style="display: flex; gap: 4px; margin-top: 2px;">
                <button class="layer-btn active" id="layerGroundBtn" onclick="switchLayer('ground')">Ground Floor</button>
                <button class="layer-btn" id="layerMezzBtn" onclick="switchLayer('mezzanine')">Mezz Floor</button>
                <button class="layer-btn" id="layerRoofBtn" onclick="switchLayer('roof')">Roof Layer</button>
            </div>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="layer-btn" id="layerSprinklerBtn" onclick="switchLayer('sprinkler')">Sprinkler Shutoffs</button>
                <button class="layer-btn" id="layerWaterBtn" onclick="switchLayer('water')">Water Shutoffs</button>
                <button class="layer-btn" id="layerGasBtn" onclick="switchLayer('gas')">Gas Shutoffs</button>
            </div>
            <!-- ENHANCEMENT 3: GHOST LAYER TOGGLE -->
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="ghostLayerToggle" onchange="render()" style="width: auto; margin: 0;">
                <label for="ghostLayerToggle" style="color: #38bdf8; cursor: pointer;">Ghost Ground Walls Underneath</label>
            </div>
        </div>

        <!-- ENHANCEMENT 4: DISTANCE MEASUREMENT TOOL -->
        <div>
            <label>📏 Measurement Tool</label>
            <button id="measureToolBtn" onclick="toggleMeasurementMode()" style="background: #1e293b; color: #38bdf8; font-size: 11px; padding: 6px;">Start Distance Ruler</button>
            <div id="measureResultDisplay" style="font-size: 11px; color: #fbbf24; text-align: center; margin-top: 2px;"></div>
        </div>

        <div>
            <label>Interaction Mode</label>
            <div style="display: flex; gap: 6px; margin-top: 2px;">
                <button id="modeEditBtn" class="mode-btn active" onclick="setMode('edit')">Edit Layout (Drag)</button>
                <button id="modePanBtn" class="mode-btn" onclick="setMode('pan')">Pan / Zoom & Inspect</button>
            </div>
        </div>
        <hr style="border-color: #1e293b; margin: 4px 0;">
        <div class="tab-bar">
            <button class="tab-btn active" id="tabDeptBtn" onclick="switchTab('dept')">Zones & Yard</button>
            <button class="tab-btn" id="tabAssetBtn" onclick="switchTab('asset')">Assets Menu</button>
        </div>
        <div id="panelDept" class="panel active">
            <h3>Zone / Yard Management</h3>
            <div>
                <label>Add New Zone / Yard Area</label>
                <input type="text" id="newDeptName" value="North Yard Area">
                <select id="newDeptType">
                    <option value="yard">External Yard / Grading (Rect)</option>
                    <option value="racking">Racking Zone (Rect)</option>
                    <option value="mezzanine">Mezzanine Floor (Rect)</option>
                    <option value="general">General Dept / Roof Unit</option>
                </select>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col (-6 to 34)</label><input type="number" id="newDeptX" step="0.5" value="2"></div>
                    <div style="flex:1;"><label>Y Row (-4 to 18)</label><input type="number" id="newDeptY" step="0.5" value="-4"></div>
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="newDeptW" step="0.5" value="12"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="newDeptH" step="0.5" value="5"></div>
                </div>
                <button onclick="addDepartment()" style="margin-top: 6px;">Add Zone to Map</button>
            </div>
        </div>
        <div id="panelAsset" class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Utility & Fire Assets</h3>
                <button onclick="openCategoryModal()" style="width: auto; padding: 2px 6px; font-size: 10px; background: #1e293b; color: #38bdf8;">⚙️ Categories</button>
            </div>
            <div>
                <label>Asset Name</label>
                <input type="text" id="newAssetName" value="Fire Hydrant #1">
                <label>Category</label>
                <select id="newAssetCategory"></select>
                <label>Dot Icon (Emoji)</label>
                <input type="text" id="newAssetEmoji" value="🧯" style="text-align: center; font-size: 16px;">
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <div style="flex:1;"><label>X Col (-6 to 34)</label><input type="number" id="newAssetX" step="0.25" value="5"></div>
                    <div style="flex:1;"><label>Y Row (-4 to 18)</label><input type="number" id="newAssetY" step="0.25" value="-2"></div>
                </div>
                <button onclick="addAsset()" style="margin-top: 6px;">Add Fire/Utility Asset</button>
            </div>
        </div>
    </div>
    <div id="canvas-container">
        <svg id="layoutSvg" width="2200" height="1400">
            <g id="viewport"></g>
        </svg>
    </div>

    <!-- ITEM DETAILS & PHOTO MODAL -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #38bdf8; margin: 0;">Item Details</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalElementId">
                <div>
                    <label>Item Name / Designation</label>
                    <input type="text" id="modalName" oninput="saveModalLiveChanges()">
                </div>
                <div id="modalAssetFields" style="display: flex; gap: 6px;">
                    <div style="flex: 3;">
                        <label>Asset Category</label>
                        <select id="modalCategory" onchange="saveModalLiveChanges()"></select>
                    </div>
                    <div style="flex: 1;">
                        <label>Dot Emoji</label>
                        <input type="text" id="modalEmoji" oninput="saveModalLiveChanges()" style="text-align: center; font-size: 16px;">
                    </div>
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col</label><input type="number" id="modalX" step="0.25" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Y Row</label><input type="number" id="modalY" step="0.25" oninput="saveModalLiveChanges()"></div>
                </div>
                <div id="modalSizeContainer" style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="modalW" step="0.25" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="modalH" step="0.25" oninput="saveModalLiveChanges()"></div>
                </div>
                <div>
                    <label>Location Photos <span id="upload-status" style="color: #38bdf8; font-weight: normal;"></span></label>
                    <input type="file" id="photoUploadInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">
                    <div class="photo-gallery" id="modalPhotoGallery"></div>
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label>Spreadsheet Details / Custom Records</label>
                        <button onclick="addSpreadsheetRow()" style="width: auto; padding: 2px 8px; font-size: 10px;">+ Add Row</button>
                    </div>
                    <table class="spreadsheet-table">
                        <thead>
                            <tr>
                                <th style="width: 35%;">Parameter</th>
                                <th style="width: 55%;">Value</th>
                                <th style="width: 10%;"></th>
                            </tr>
                        </thead>
                        <tbody id="spreadsheetBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="danger" onclick="deleteItemFromModal()" style="width: auto; padding: 6px 12px;">Delete Item</button>
                <button onclick="closeModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Done / Save</button>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX & CATEGORY MODALS -->
    <div id="lightbox-overlay" onclick="closeLightbox()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" style="position: absolute; top: -35px; right: 0; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">×</button>
            <img id="lightboxImage" src="" style="max-width: 85vw; max-height: 80vh; object-fit: contain; border-radius: 4px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
            <div id="lightboxCaption" style="margin-top: 8px; color: #38bdf8; font-size: 13px; font-weight: bold;"></div>
        </div>
    </div>

    <div id="category-modal-overlay">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h3 style="color: #38bdf8; margin: 0;">Manage Asset Categories</h3>
                <button class="close-modal" onclick="closeCategoryModal()">×</button>
            </div>
            <div class="modal-body">
                <div>
                    <label>Add New Category</label>
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <input type="text" id="newCatName" placeholder="Category Name" style="flex: 2;">
                        <input type="color" id="newCatColor" value="#38bdf8" style="flex: 0.5; height: 30px; padding: 0; cursor: pointer;">
                        <button onclick="addCategory()" style="flex: 1; margin-top: 0;">Add Category</button>
                    </div>
                </div>
                <div style="margin-top: 8px;">
                    <label>Existing Categories</label>
                    <table class="spreadsheet-table" style="margin-top: 6px;">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th style="width: 70px; text-align: center;">Color</th>
                                <th style="width: 50px; text-align: center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeCategoryModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Save & Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCrKAut8_5nHWTWtYqZZr5HOENGd8mqZxE",
            authDomain: "imi1-interactive-map-8d929.firebaseapp.com",
            projectId: "imi1-interactive-map-8d929",
            storageBucket: "imi1-interactive-map-8d929.firebasestorage.app",
            messagingSenderId: "613133090515",
            appId: "1:613133090515:web:f8f9be365f484a3a5c5e26",
            measurementId: "G-4QR2RSSTN1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gridSize = 25;
        const minCol = -8;
        const maxCol = 38;
        const minRow = -6;
        const maxRow = 20;
        const buildingCols = 30; 
        const buildingRows = 14; 
        let currentMode = 'edit'; 
        let currentTab = 'dept'; 
        let currentLayer = 'ground'; 
        let categories = [
            { name: "Fire Safety", color: "#ef4444" },
            { name: "Electrical", color: "#f97316" },
            { name: "Plumbing", color: "#38bdf8" },
            { name: "Safety", color: "#fbbf24" },
            { name: "HVAC", color: "#34d399" },
            { name: "General", color: "#94a3b8" }
        ];
        let elements = [];
        let selectedId = null;
        let isDraggingElement = false;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let viewTransform = { x: 250, y: 180, scale: 0.9 };

        // Measurement tool states
        let isMeasuring = false;
        let measureStartPoint = null;

        let activePointers = new Map();
        let initialPinchDistance = null;
        let initialPinchScale = 1;
        let initialPinchCenter = { x: 0, y: 0 };
        let initialTransform = { x: 0, y: 0 };

        const container = document.getElementById("canvas-container");
        const svg = document.getElementById("layoutSvg");
        const viewport = document.getElementById("viewport");
        const syncStatus = document.getElementById("sync-status");

        async function loadFromFirebase() {
            try {
                const docRef = doc(db, "layouts", "facility_main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (data.elements) elements = data.elements;
                    if (data.categories) categories = data.categories;
                    syncStatus.innerText = "Loaded from Firebase";
                } else {
                    await saveToFirebase();
                }
                populateCategoryDropdowns();
                render();
            } catch (error) {
                console.error("Error loading layout:", error);
                syncStatus.innerText = "Error Loading Database";
                syncStatus.style.color = "#ef4444";
                populateCategoryDropdowns();
                render();
            }
        }
        async function saveToFirebase() {
            try {
                syncStatus.innerText = "Saving...";
                syncStatus.style.color = "#fbbf24";
                await setDoc(doc(db, "layouts", "facility_main"), {
                    elements: elements,
                    categories: categories,
                    updatedAt: new Date().toISOString()
                });
                syncStatus.innerText = "Synced to Firebase";
                syncStatus.style.color = "#10b981";
            } catch (error) {
                console.error("Error saving layout:", error);
                syncStatus.innerText = "Sync Failed";
                syncStatus.style.color = "#ef4444";
            }
        }

        // Enhancement 1: Search & Auto-Focus Functionality
        window.filterSearchAssets = function() {
            let query = document.getElementById("assetSearchInput").value.toLowerCase().trim();
            let resultsList = document.getElementById("searchResultsList");
            resultsList.innerHTML = "";
            if (!query) {
                resultsList.style.display = "none";
                return;
            }
            let matches = elements.filter(el => el.name.toLowerCase().includes(query));
            if (matches.length === 0) {
                resultsList.style.display = "none";
                return;

        // Enhancement 4: Measurement Tool Clicks
        function handleMeasurementClick(gridX, gridY) {
            if (!measureStartPoint) {
                measureStartPoint = { x: gridX, y: gridY };
                document.getElementById("measureResultDisplay").innerText = "Start point set. Click second point.";
            } else {
                let dx = Math.abs(gridX - measureStartPoint.x) * 10; // Assuming 1 grid unit = 10 feet
                let dy = Math.abs(gridY - measureStartPoint.y) * 10;
                let totalDist = Math.sqrt(dx * dx + dy * dy).toFixed(1);
                document.getElementById("measureResultDisplay").innerText = `Distance: ~${totalDist} ft`;
                measureStartPoint = null;
                isMeasuring = false;
                document.getElementById("measureToolBtn").style.background = "#1e293b";
                document.getElementById("measureToolBtn").style.color = "#38bdf8";
                document.getElementById("measureToolBtn").innerText = "Start Distance Ruler";
            }
        }

        function getPinchDistance(p1, p2) {
            let dx = p1.clientX - p2.clientX; let dy = p1.clientY - p2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function getPinchCenter(p1, p2) {
            return { x: (p1.clientX + p2.clientX) / 2, y: (p1.clientY + p2.clientY) / 2 };
        }
        function updateCoordinates(clientX, clientY) {
            let rect = container.getBoundingClientRect();
            let localX = (clientX - rect.left - viewTransform.x) / viewTransform.scale;
            let localY = (clientY - rect.top - viewTransform.y) / viewTransform.scale;
            let coordDisplay = document.getElementById("coord-display");
            coordDisplay.innerHTML = `Grid: <b>Row ${getRowLabel(Math.floor(localY / gridSize))}, Col ${(localX / gridSize + 1).toFixed(2)}</b>`;
        }

        container.addEventListener("pointerdown", (e) => {
            activePointers.set(e.pointerId, e);
            if (activePointers.size === 1) {
                if (isMeasuring) {
                    let rect = container.getBoundingClientRect();
                    let localX = (e.clientX - rect.left - viewTransform.x) / viewTransform.scale;
                    let localY = (e.clientY - rect.top - viewTransform.y) / viewTransform.scale;
                    handleMeasurementClick(localX / gridSize, localY / gridSize);
                    return;
                }
                if (currentMode === 'pan') {
                    isPanning = true; container.classList.add("panning");
                    panStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
                } else if (currentMode === 'edit') { selectedId = null; render(); }
            } else if (activePointers.size === 2) {
                isPanning = false; isDraggingElement = false; container.classList.remove("panning");
                let points = Array.from(activePointers.values());
                initialPinchDistance = getPinchDistance(points[0], points[1]);
                initialPinchScale = viewTransform.scale;
                initialPinchCenter = getPinchCenter(points[0], points[1]);
                initialTransform = { x: viewTransform.x, y: viewTransform.y };
            }
        });

        container.addEventListener("pointermove", (e) => {
            if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, e);
            if (activePointers.size === 1) {
                updateCoordinates(e.clientX, e.clientY);
                if (isPanning && currentMode === 'pan') {
                    viewTransform.x = e.clientX - panStart.x;
                    viewTransform.y = e.clientY - panStart.y;
                    render();
                }
            } else if (activePointers.size === 2 && initialPinchDistance) {
                let points = Array.from(activePointers.values());
                let scaleFactor = getPinchDistance(points[0], points[1]) / initialPinchDistance;
                let targetScale = Math.min(Math.max(initialPinchScale * scaleFactor, 0.25), 4.0);
                let rect = container.getBoundingClientRect();
                viewTransform.scale = targetScale;
                viewTransform.x = getPinchCenter(points[0], points[1]).x - rect.left - (initialPinchCenter.x - rect.left - initialTransform.x) * (targetScale / initialPinchScale);
                viewTransform.y = getPinchCenter(points[0], points[1]).y - rect.top - (initialPinchCenter.y - rect.top - initialTransform.y) * (targetScale / initialPinchScale);
                render();
            }
        });

        const handlePointerEnd = (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) initialPinchDistance = null;
            if (activePointers.size === 0) {
                if (isPanning) { isPanning = false; container.classList.remove("panning"); }
                if (isDraggingElement) { isDraggingElement = false; saveToFirebase(); }
            }
        };
        container.addEventListener("pointerup", handlePointerEnd);
        container.addEventListener("pointercancel", handlePointerEnd);
        container.addEventListener("pointerleave", handlePointerEnd);

        container.addEventListener("wheel", (e) => {
            e.preventDefault();
            let oldScale = viewTransform.scale;
            viewTransform.scale = e.deltaY < 0 ? Math.min(viewTransform.scale * 1.1, 4.0) : Math.max(viewTransform.scale * 0.9, 0.25);
            let rect = container.getBoundingClientRect();
            viewTransform.x = (e.clientX - rect.left) - ((e.clientX - rect.left) - viewTransform.x) * (viewTransform.scale / oldScale);
            viewTransform.y = (e.clientY - rect.top) - ((e.clientY - rect.top) - viewTransform.y) * (viewTransform.scale / oldScale);
            render();
        }, { passive: false });

        function startDragElement(e, el) {
            selectedId = el.id; isDraggingElement = true;
            let startX = e.clientX, startY = e.clientY, origX = el.x, origY = el.y;
            function onPointerMove(e) {
                if (!isDraggingElement) return;
                el.x = parseFloat((origX + ((e.clientX - startX) / viewTransform.scale / gridSize)).toFixed(2));
                el.y = parseFloat((origY + ((e.clientY - startY) / viewTransform.scale / gridSize)).toFixed(2));

            }
            function onPointerUp() {

                window.removeEventListener("pointermove", onPointerMove);
                window.removeEventListener("pointerup", onPointerUp);

            }
            window.addEventListener("pointermove", onPointerMove);
            window.addEventListener("pointerup", onPointerUp);

        }

        }
        window.addSpreadsheetRow = function() {
            let el = elements.find(item => item.id === parseInt(document.getElementById("modalElementId").value));
            if (el) { el.spreadsheetData.push({ key: "Field", value: "Value" }); renderSpreadsheet(el); saveToFirebase(); }
        }
        window.deleteItemFromModal = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            if (confirm("Delete this item?")) { elements = elements.filter(item => item.id !== id); closeModal(); saveToFirebase(); }
        }
        window.addDepartment = function() {
            elements.push({
                id: Date.now(), layer: currentLayer, name: document.getElementById("newDeptName").value,
                type: document.getElementById("newDeptType").value,
                x: parseFloat(document.getElementById("newDeptX").value) || 0, y: parseFloat(document.getElementById("newDeptY").value) || 0,
                w: parseFloat(document.getElementById("newDeptW").value) || 5, h: parseFloat(document.getElementById("newDeptH").value) || 5,
                photos: [], spreadsheetData: [{key: "Status", value: "Active"}]
            });
            render(); saveToFirebase();
        }
        window.addAsset = function() {
            elements.push({
                id: Date.now(), layer: currentLayer, name: document.getElementById("newAssetName").value,
                type: "asset", category: document.getElementById("newAssetCategory").value, emoji: document.getElementById("newAssetEmoji").value || "🧯",
                x: parseFloat(document.getElementById("newAssetX").value) || 0, y: parseFloat(document.getElementById("newAssetY").value) || 0,
                photos: [], spreadsheetData: [{key: "Asset Type", value: "Safety/Fire Node"}]
            });
            render(); saveToFirebase();
        }
        loadFromFirebase();
    </script>
</body>
</html>
