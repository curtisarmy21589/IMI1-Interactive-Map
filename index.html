<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout Builder</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 300px;
            background-color: #1b263b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }
        h2, h3 { margin-top: 0; color: #41c1ff; }
        label { font-size: 12px; color: #a5c4d4; }
        input, select, button {
            width: 100%;
            padding: 8px;
            background: #0d1b2a;
            border: 1px solid #41c1ff;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 4px;
        }
        button {
            background: #1d3557;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #41c1ff; color: #0d1b2a; }
        .danger { background: #780000; border-color: #d90429; }
        .danger:hover { background: #d90429; color: #fff; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #0b131d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
        svg {
            background-color: #0d1b2a;
            border: 2px dashed #1d3557;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .item-rect {
            stroke-width: 2;
            cursor: move;
            transition: stroke 0.2s;
        }
        .item-rect:hover {
            stroke: #fff;
        }
        .item-rect.selected {
            stroke: #ffb703;
            stroke-width: 3;
        }
        .grid-line {
            stroke: #1b263b;
            stroke-width: 1;
        }
        .axis-label {
            font-size: 10px;
            fill: #415a77;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Layout Builder</h2>
        <div>
            <h3>Add New Element</h3>
            <label>Name / Label</label>
            <input type="text" id="newName" value="RACKING #3">
            
            <label>Type / Color Theme</label>
            <select id="newType">
                <option value="racking">Racking (Orange)</option>
                <option value="mezzanine">Mezzanine (Green)</option>
                <option value="utility">Utility / Panel (Blue/Orange)</option>
            </select>

            <label>X Position (Columns)</label>
            <input type="number" id="newX" value="10">

            <label>Y Position (Rows)</label>
            <input type="number" id="newY" value="10">

            <label>Width</label>
            <input type="number" id="newW" value="5">

            <label>Height</label>
            <input type="number" id="newH" value="5">

            <button onclick="addElement()" style="margin-top: 10px;">Add to Layout</button>
        </div>

        <hr style="border-color: #1b263b;">

        <div id="inspector" style="display:none;">
            <h3>Edit Selected</h3>
            <input type="hidden" id="editId">
            <label>Name</label>
            <input type="text" id="editName" oninput="updateSelected()">
            <label>X</label>
            <input type="number" id="editX" oninput="updateSelected()">
            <label>Y</label>
            <input type="number" id="editY" oninput="updateSelected()">
            <label>Width</label>
            <input type="number" id="editW" oninput="updateSelected()">
            <label>Height</label>
            <input type="number" id="editH" oninput="updateSelected()">
            
            <button class="danger" onclick="deleteSelected()" style="margin-top: 10px;">Delete Element</button>
        </div>
        
        <div>
            <p style="font-size: 11px; color: #8d99ae; margin-top: 20px;">
                💡 <b>Tip:</b> Click any zone on the grid to select, edit parameters, or drag to move. Use the grid lines as columns/rows.
            </p>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="layoutSvg" width="1000" height="600" viewBox="0 0 1000 600"></svg>
    </div>

<script>
    const gridSize = 20; // Size of each grid cell in pixels
    const cols = 50;
    const rows = 30;

    // Initial state matching your blueprint photo
    let elements = [
        { id: 1, name: "MAIN RACKING AREA #1 (Cols 9 to 29.25 | Rows 6.25 to C)", type: "racking", x: 9, y: 6, w: 20, h: 8 },
        { id: 2, name: "RACKING #2 (Cols 24.5 to 28.5 | Rows 11.5 to L.5)", type: "racking", x: 24, y: 11, w: 5, h: 5 },
        { id: 3, name: "MEZZANINE: FLOOR (Cols 2 to 22 | Rows J to M.9)", type: "mezzanine", x: 2, y: 15, w: 20, h: 7 },
        { id: 4, name: "Main Distribution Panel MDP-1", type: "utility", x: 4, y: 6, w: 2, h: 2 },
        { id: 5, name: "Water Main Shutoff", type: "utility", x: 8, y: 6, w: 2, h: 2 }
    ];

    let selectedId = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    const svg = document.getElementById("layoutSvg");
    svg.setAttribute("width", cols * gridSize);
    svg.setAttribute("height", rows * gridSize);
    svg.setAttribute("viewBox", `0 0 ${cols * gridSize} ${rows * gridSize}`);

    function render() {
        svg.innerHTML = "";

        // Draw Grid Lines
        for (let c = 0; c <= cols; c++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", c * gridSize);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", c * gridSize);
            line.setAttribute("y2", rows * gridSize);
            line.setAttribute("class", "grid-line");
            svg.appendChild(line);
        }
        for (let r = 0; r <= rows; r++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", 0);
            line.setAttribute("y1", r * gridSize);
            line.setAttribute("x2", cols * gridSize);
            line.setAttribute("y2", r * gridSize);
            line.setAttribute("class", "grid-line");
            svg.appendChild(line);
        }

        // Draw Outer Border / Yard Zone
        let border = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        border.setAttribute("x", gridSize);
        border.setAttribute("y", gridSize);
        border.setAttribute("width", (cols - 2) * gridSize);
        border.setAttribute("height", (rows - 2) * gridSize);
        border.setAttribute("fill", "none");
        border.setAttribute("stroke", "#41c1ff");
        border.setAttribute("stroke-width", "2");
        border.setAttribute("stroke-dasharray", "4");
        svg.appendChild(border);

        // Draw Elements
        elements.forEach(el => {
            let g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", el.x * gridSize);
            rect.setAttribute("y", el.y * gridSize);
            rect.setAttribute("width", el.w * gridSize);
            rect.setAttribute("height", el.h * gridSize);
            rect.setAttribute("class", `item-rect ${el.id === selectedId ? 'selected' : ''}`);

            // Styling based on type
            if (el.type === 'racking') {
                rect.setAttribute("fill", "#d47a00");
                rect.setAttribute("fill-opacity", "0.4");
                rect.setAttribute("stroke", "#ff9f1c");
            } else if (el.type === 'mezzanine') {
                rect.setAttribute("fill", "#2b9348");
                rect.setAttribute("fill-opacity", "0.4");
                rect.setAttribute("stroke", "#52b788");
            } else {
                rect.setAttribute("fill", "#e76f51");
                rect.setAttribute("fill-opacity", "0.7");
                rect.setAttribute("stroke", "#f4a261");
            }

            // Drag and click handlers
            rect.addEventListener("mousedown", (e) => startDrag(e, el));

            let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", (el.x * gridSize) + 6);
            text.setAttribute("y", (el.y * gridSize) + 16);
            text.setAttribute("fill", "#fff");
            text.setAttribute("font-size", "11px");
            text.setAttribute("font-weight", "bold");
            text.style.pointerEvents = "none";
            text.textContent = el.name;

            g.appendChild(rect);
            g.appendChild(text);
            svg.appendChild(g);
        });
    }

    function startDrag(e, el) {
        selectedId = el.id;
        isDragging = true;
        let mouseX = e.clientX;
        let mouseY = e.clientY;
        dragOffset = {
            x: mouseX - (el.x * gridSize),
            y: mouseY - (el.y * gridSize)
        };
        populateInspector(el);
        render();

        function onMouseMove(e) {
            if (!isDragging) return;
            let newPxX = e.clientX - dragOffset.x;
            let newPxY = e.clientY - dragOffset.y;
            el.x = Math.max(0, Math.min(cols - el.w, Math.round(newPxX / gridSize)));
            el.y = Math.max(0, Math.min(rows - el.h, Math.round(newPxY / gridSize)));
            populateInspector(el);
            render();
        }

        function onMouseUp() {
            isDragging = false;
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
        }

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
    }

    function populateInspector(el) {
        document.getElementById("inspector").style.display = "block";
        document.getElementById("editId").value = el.id;
        document.getElementById("editName").value = el.name;
        document.getElementById("editX").value = el.x;
        document.getElementById("editY").value = el.y;
        document.getElementById("editW").value = el.w;
        document.getElementById("editH").value = el.h;
    }

    function updateSelected() {
        let id = parseInt(document.getElementById("editId").value);
        let el = elements.find(item => item.id === id);
        if (el) {
            el.name = document.getElementById("editName").value;
            el.x = parseInt(document.getElementById("editX").value) || 0;
            el.y = parseInt(document.getElementById("editY").value) || 0;
            el.w = parseInt(document.getElementById("editW").value) || 1;
            el.h = parseInt(document.getElementById("editH").value) || 1;
            render();
        }
    }

    function addElement() {
        let newEl = {
            id: Date.now(),
            name: document.getElementById("newName").value,
            type: document.getElementById("newType").value,
            x: parseInt(document.getElementById("newX").value),
            y: parseInt(document.getElementById("newY").value),
            w: parseInt(document.getElementById("newW").value),
            h: parseInt(document.getElementById("newH").value)
        };
        elements.push(newEl);
        render();
    }

    function deleteSelected() {
        let id = parseInt(document.getElementById("editId").value);
        elements = elements.filter(item => item.id !== id);
        document.getElementById("inspector").style.display = "none";
        selectedId = null;
        render();
    }

    // Initial render
    render();
</script>

</body>
</html>
