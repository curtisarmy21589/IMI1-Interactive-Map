<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout Builder - Blueprint Match</title>
    <style>
        body {
            background-color: #0b131d;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: #111b27;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #1f2d3d;
        }
        h2, h3 { margin-top: 0; color: #38bdf8; }
        label { font-size: 12px; color: #94a3b8; }
        input, select, button {
            width: 100%;
            padding: 8px;
            background: #0b131d;
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 4px;
        }
        button {
            background: #1e293b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #38bdf8; color: #0b131d; }
        .mode-btn {
            background: #070d14;
            border: 2px solid #1e293b;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0b131d;
            border-color: #fff;
        }
        .danger { background: #7f1d1d; border-color: #ef4444; }
        .danger:hover { background: #ef4444; color: #fff; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #070d14;
            overflow: hidden;
            cursor: grab;
        }
        #canvas-container.panning {
            cursor: grabbing;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        .item-shape {
            cursor: pointer;
            transition: stroke 0.2s;
        }
        .item-shape:hover {
            stroke: #fff;
        }
        .item-shape.selected {
            stroke: #fbbf24;
            stroke-width: 3;
        }
        .grid-line {
            stroke: #132235;
            stroke-width: 1;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Layout Builder</h2>
        
        <div>
            <h3>Interaction Mode</h3>
            <div style="display: flex; gap: 10px;">
                <button id="modeEditBtn" class="mode-btn active" onclick="setMode('edit')">Edit Layout</button>
                <button id="modePanBtn" class="mode-btn" onclick="setMode('pan')">Pan / Zoom</button>
            </div>
        </div>

        <hr style="border-color: #1e293b;">

        <div>
            <h3>Add New Element</h3>
            <label>Name / Label</label>
            <input type="text" id="newName" value="RACKING #3">
            
            <label>Category / Type</label>
            <select id="newType" onchange="toggleSizeInputs()">
                <option value="racking">Racking Zone (Rect)</option>
                <option value="mezzanine">Mezzanine Floor (Rect)</option>
                <option value="asset">Utility Asset (Dot)</option>
            </select>

            <label>X Position (Grid Column)</label>
            <input type="number" id="newX" value="10">

            <label>Y Position (Grid Row)</label>
            <input type="number" id="newY" value="10">

            <div id="dimensionInputs">
                <label>Width</label>
                <input type="number" id="newW" value="5">

                <label>Height</label>
                <input type="number" id="newH" value="5">
            </div>

            <button onclick="addElement()" style="margin-top: 10px;">Add Element</button>
        </div>

        <hr style="border-color: #1e293b;">

        <div id="inspector" style="display:none;">
            <h3>Edit Selected Element</h3>
            <input type="hidden" id="editId">
            <label>Name</label>
            <input type="text" id="editName" oninput="updateSelected()">
            <label>X Position</label>
            <input type="number" id="editX" oninput="updateSelected()">
            <label>Y Position</label>
            <input type="number" id="editY" oninput="updateSelected()">
            
            <div id="editDimensionFields">
                <label>Width</label>
                <input type="number" id="editW" oninput="updateSelected()">
                <label>Height</label>
                <input type="number" id="editH" oninput="updateSelected()">
            </div>
            
            <button class="danger" onclick="deleteSelected()" style="margin-top: 10px;">Delete Element</button>
        </div>
        
        <div>
            <p style="font-size: 11px; color: #64748b; margin-top: 10px;">
                💡 <b>Instructions:</b><br>
                • <b>Edit Layout Mode:</b> Click and drag departments/assets.<br>
                • <b>Pan / Zoom Mode:</b> Drag canvas to pan; scroll mouse wheel to zoom in/out.
            </p>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="layoutSvg" width="1600" height="1000">
            <g id="viewport">
                <!-- Blueprint components rendered dynamically -->
            </g>
        </svg>
    </div>

<script>
    const gridSize = 20;
    const cols = 65;
    const rows = 45;

    let currentMode = 'edit'; // 'edit' or 'pan'

    // Exact Mezzanine and Racking specifications preserved as requested
    let elements = [
        { id: 1, name: "MAIN RACKING AREA #1 (Col 9 to 29.25 | Rows 6.25 to 13)", type: "racking", x: 9, y: 6, w: 20, h: 7 },
        { id: 2, name: "RACKING #2 (Col. 34.5 to 38.8 | Rows 14.8 to 21.8)", type: "racking", x: 34, y: 15, w: 5, h: 7 },
        { id: 3, name: "MEZZANINE FLOOR (Col 2 to 22 | Rows 21 to 30.8)", type: "mezzanine", x: 2, y: 21, w: 20, h: 10 },
        { id: 4, name: "Main Distribution Panel MDP-1", type: "asset", x: 12, y: 10 },
        { id: 5, name: "Water Main Shutoff", type: "asset", x: 17, y: 10 }
    ];

    let selectedId = null;
    let isDraggingElement = false;
    let isPanning = false;
    let dragOffset = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    
    // Viewport Transform State (Pan & Zoom)
    let viewTransform = { x: 40, y: 40, scale: 1 };

    const container = document.getElementById("canvas-container");
    const svg = document.getElementById("layoutSvg");
    const viewport = document.getElementById("viewport");

    function setMode(mode) {
        currentMode = mode;
        document.getElementById("modeEditBtn").classList.toggle("active", mode === 'edit');
        document.getElementById("modePanBtn").classList.toggle("active", mode === 'pan');
        container.style.cursor = mode === 'pan' ? 'grab' : 'default';
        selectedId = null;
        document.getElementById("inspector").style.display = "none";
        render();
    }

    function toggleSizeInputs() {
        let type = document.getElementById("newType").value;
        document.getElementById("dimensionInputs").style.display = (type === 'asset') ? 'none' : 'block';
    }

    function updateTransformString() {
        viewport.setAttribute("transform", `translate(${viewTransform.x}, ${viewTransform.y}) scale(${viewTransform.scale})`);
    }

    function render() {
        viewport.innerHTML = "";
        updateTransformString();

        // 1. Grid Lines
        for (let c = 0; c <= cols; c++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", c * gridSize);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", c * gridSize);
            line.setAttribute("y2", rows * gridSize);
            line.setAttribute("class", "grid-line");
            viewport.appendChild(line);
        }
        for (let r = 0; r <= rows; r++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", 0);
            line.setAttribute("y1", r * gridSize);
            line.setAttribute("x2", cols * gridSize);
            line.setAttribute("y2", r * gridSize);
            line.setAttribute("class", "grid-line");
            viewport.appendChild(line);
        }

        // 2. Exterior / Yard Zone Border (Dashed Outer Box)
        let yardBorder = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        yardBorder.setAttribute("x", 0.5 * gridSize);
        yardBorder.setAttribute("y", 0.5 * gridSize);
        yardBorder.setAttribute("width", (cols - 1) * gridSize);
        yardBorder.setAttribute("height", (rows - 1) * gridSize);
        yardBorder.setAttribute("fill", "none");
        yardBorder.setAttribute("stroke", "#38bdf8");
        yardBorder.setAttribute("stroke-width", "1.5");
        yardBorder.setAttribute("stroke-dasharray", "6,4");
        viewport.appendChild(yardBorder);

        // Yard Zone Label Text
        let yardText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        yardText.setAttribute("x", 1 * gridSize);
        yardText.setAttribute("y", 1.8 * gridSize);
        yardText.setAttribute("fill", "#38bdf8");
        yardText.setAttribute("font-size", "10px");
        yardText.setAttribute("font-weight", "bold");
        yardText.textContent = "EXTERIOR / YARD ZONE";
        viewport.appendChild(yardText);

        // 3. Building Interior Solid Wall Boundary (Cyan Line Box)
        let buildingWall = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        buildingWall.setAttribute("x", 2 * gridSize);
        buildingWall.setAttribute("y", 4 * gridSize);
        buildingWall.setAttribute("width", (cols - 4) * gridSize);
        buildingWall.setAttribute("height", (rows - 6) * gridSize);
        buildingWall.setAttribute("fill", "none");
        buildingWall.setAttribute("stroke", "#38bdf8");
        buildingWall.setAttribute("stroke-width", "1.5");
        viewport.appendChild(buildingWall);

        // Bottom right detail line styling matching reference image (Magenta accent line)
        let accentLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
        accentLine.setAttribute("x1", 42 * gridSize);
        accentLine.setAttribute("y1", (rows - 2) * gridSize);
        accentLine.setAttribute("x2", (cols - 2) * gridSize);
        accentLine.setAttribute("y2", (rows - 2) * gridSize);
        accentLine.setAttribute("stroke", "#ec4899");
        accentLine.setAttribute("stroke-width", "1.5");
        viewport.appendChild(accentLine);

        let accentText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        accentText.setAttribute("x", 2.2 * gridSize);
        accentText.setAttribute("y", (rows - 2.3) * gridSize);
        accentText.setAttribute("fill", "#ec4899");
        accentText.setAttribute("font-size", "8px");
        accentText.textContent = "COLUMNS 6.8 WALL LINE";
        viewport.appendChild(accentText);

        // 4. Render Elements (Departments as Rectangles, Assets as Dots)
        elements.forEach(el => {
            let g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            if (el.type === 'asset') {
                // Utility Asset rendered strictly as a Dot (Circle)
                let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                let cx = (el.x * gridSize) + (gridSize / 2);
                let cy = (el.y * gridSize) + (gridSize / 2);
                circle.setAttribute("cx", cx);
                circle.setAttribute("cy", cy);
                circle.setAttribute("r", 7);
                circle.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);
                circle.setAttribute("fill", "#f97316");
                circle.setAttribute("stroke", "#fb923c");
                circle.setAttribute("stroke-width", "1.5");

                circle.addEventListener("mousedown", (e) => {
                    if (currentMode === 'edit') {
                        e.stopPropagation();
                        startDragElement(e, el);
                    }
                });

                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", cx + 10);
                text.setAttribute("y", cy + 4);
                text.setAttribute("fill", "#fff");
                text.setAttribute("font-size", "10px");
                text.setAttribute("font-weight", "bold");
                text.style.pointerEvents = "none";
                text.textContent = el.name;

                g.appendChild(circle);
                g.appendChild(text);

            } else {
                // Departments / Racking / Mezzanine rendered as Rectangles
                let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", el.x * gridSize);
                rect.setAttribute("y", el.y * gridSize);
                rect.setAttribute("width", el.w * gridSize);
                rect.setAttribute("height", el.h * gridSize);
                rect.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);

                if (el.type === 'racking') {
                    rect.setAttribute("fill", "#d97706");
                    rect.setAttribute("fill-opacity", "0.35");
                    rect.setAttribute("stroke", "#f59e0b");
                } else {
                    rect.setAttribute("fill", "#10b981");
                    rect.setAttribute("fill-opacity", "0.35");
                    rect.setAttribute("stroke", "#34d399");
                }
                rect.setAttribute("stroke-width", "1");

                rect.addEventListener("mousedown", (e) => {
                    if (currentMode === 'edit') {
                        e.stopPropagation();
                        startDragElement(e, el);
                    }
                });

                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", (el.x * gridSize) + 6);
                text.setAttribute("y", (el.y * gridSize) + 16);
                text.setAttribute("fill", "#fff");
                text.setAttribute("font-size", "10px");
                text.setAttribute("font-weight", "bold");
                text.style.pointerEvents = "none";
                text.textContent = el.name;

                g.appendChild(rect);
                g.appendChild(text);
            }

            viewport.appendChild(g);
        });
    }

    // Mouse Wheel Zooming
    container.addEventListener("wheel", (e) => {
        e.preventDefault();
        let zoomIntensity = 0.1;
        let oldScale = viewTransform.scale;
        
        if (e.deltaY < 0) {
            viewTransform.scale = Math.min(viewTransform.scale * (1 + zoomIntensity), 3.0);
        } else {
            viewTransform.scale = Math.max(viewTransform.scale * (1 - zoomIntensity), 0.3);
        }

        // Zoom toward mouse pointer position
        let rect = container.getBoundingClientRect();
        let mouseX = e.clientX - rect.left;
        let mouseY = e.clientY - rect.top;

        viewTransform.x = mouseX - (mouseX - viewTransform.x) * (viewTransform.scale / oldScale);
        viewTransform.y = mouseY - (mouseY - viewTransform.y) * (viewTransform.scale / oldScale);

        render();
    }, { passive: false });

    // Panning and Background Click Handlers
    container.addEventListener("mousedown", (e) => {
        if (currentMode === 'pan') {
            isPanning = true;
            container.classList.add("panning");
            panStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
        } else if (currentMode === 'edit') {
            selectedId = null;
            document.getElementById("inspector").style.display = "none";
            render();
        }
    });

    window.addEventListener("mousemove", (e) => {
        if (isPanning) {
            viewTransform.x = e.clientX - panStart.x;
            viewTransform.y = e.clientY - panStart.y;
            render();
        }
    });

    window.addEventListener("mouseup", () => {
        if (isPanning) {
            isPanning = false;
            container.classList.remove("panning");
        }
    });

    function startDragElement(e, el) {
        selectedId = el.id;
        isDraggingElement = true;
        
        let startX = e.clientX;
        let startY = e.clientY;
        
        let origX = el.x;
        let origY = el.y;

        function onMouseMove(e) {
            if (!isDraggingElement) return;
            let dx = (e.clientX - startX) / viewTransform.scale;
            let dy = (e.clientY - startY) / viewTransform.scale;
            
            el.x = Math.max(0, Math.min(cols - (el.w || 1), origX + Math.round(dx / gridSize)));
            el.y = Math.max(0, Math.min(rows - (el.h || 1), origY + Math.round(dy / gridSize)));
            
            populateInspector(el);
            render();
        }

        function onMouseUp() {
            isDraggingElement = false;
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
        }

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
        
        populateInspector(el);
        render();
    }

    function populateInspector(el) {
        document.getElementById("inspector").style.display = "block";
        document.getElementById("editId").value = el.id;
        document.getElementById("editName").value = el.name;
        document.getElementById("editX").value = el.x;
        document.getElementById("editY").value = el.y;

        let dimFields = document.getElementById("editDimensionFields");
        if (el.type === 'asset') {
            dimFields.style.display = 'none';
        } else {
            dimFields.style.display = 'block';
            document.getElementById("editW").value = el.w;
            document.getElementById("editH").value = el.h;
        }
    }

    function updateSelected() {
        let id = parseInt(document.getElementById("editId").value);
        let el = elements.find(item => item.id === id);
        if (el) {
            el.name = document.getElementById("editName").value;
            el.x = parseInt(document.getElementById("editX").value) || 0;
            el.y = parseInt(document.getElementById("editY").value) || 0;
            if (el.type !== 'asset') {
                el.w = parseInt(document.getElementById("editW").value) || 1;
                el.h = parseInt(document.getElementById("editH").value) || 1;
            }
            render();
        }
    }

    function addElement() {
        let type = document.getElementById("newType").value;
        let newEl = {
            id: Date.now(),
            name: document.getElementById("newName").value,
            type: type,
            x: parseInt(document.getElementById("newX").value),
            y: parseInt(document.getElementById("newY").value)
        };
        if (type !== 'asset') {
            newEl.w = parseInt(document.getElementById("newW").value) || 4;
            newEl.h = parseInt(document.getElementById("newH").value) || 4;
        }
        elements.push(newEl);
        render();
    }

    function deleteSelected() {
        let id = parseInt(document.getElementById("editId").value);
        elements = elements.filter(item => item.id !== id);
        document.getElementById("inspector").style.display = "none";
        selectedId = null;
        render();
    }

    // Initial render
    render();
</script>

</body>
</html>
