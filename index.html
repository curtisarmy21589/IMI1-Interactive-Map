<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout Builder with Pan & Dot Assets</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: #1b263b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }
        h2, h3 { margin-top: 0; color: #41c1ff; }
        label { font-size: 12px; color: #a5c4d4; }
        input, select, button {
            width: 100%;
            padding: 8px;
            background: #0d1b2a;
            border: 1px solid #41c1ff;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 4px;
        }
        button {
            background: #1d3557;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #41c1ff; color: #0d1b2a; }
        .mode-btn {
            background: #0b131d;
            border: 2px solid #1d3557;
        }
        .mode-btn.active {
            background: #41c1ff;
            color: #0d1b2a;
            border-color: #fff;
        }
        .danger { background: #780000; border-color: #d90429; }
        .danger:hover { background: #d90429; color: #fff; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #0b131d;
            overflow: hidden;
            cursor: grab;
        }
        #canvas-container.panning {
            cursor: grabbing;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
        }
        .item-shape {
            cursor: pointer;
            transition: stroke 0.2s;
        }
        .item-shape:hover {
            stroke: #fff;
        }
        .item-shape.selected {
            stroke: #ffb703;
            stroke-width: 3;
        }
        .grid-line {
            stroke: #1b263b;
            stroke-width: 1;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Layout Builder</h2>
        
        <div>
            <h3>Interaction Mode</h3>
            <div style="display: flex; gap: 10px;">
                <button id="modeEditBtn" class="mode-btn active" onclick="setMode('edit')">Edit Layout</button>
                <button id="modePanBtn" class="mode-btn" onclick="setMode('pan')">Pan Map</button>
            </div>
        </div>

        <hr style="border-color: #1b263b;">

        <div>
            <h3>Add New Element</h3>
            <label>Name / Label</label>
            <input type="text" id="newName" value="RACKING #3">
            
            <label>Category / Type</label>
            <select id="newType" onchange="toggleSizeInputs()">
                <option value="racking">Racking Zone (Rect)</option>
                <option value="mezzanine">Mezzanine Floor (Rect)</option>
                <option value="asset">Utility Asset (Dot)</option>
            </select>

            <label>X Position (Grid Column)</label>
            <input type="number" id="newX" value="10">

            <label>Y Position (Grid Row)</label>
            <input type="number" id="newY" value="10">

            <div id="dimensionInputs">
                <label>Width</label>
                <input type="number" id="newW" value="5">

                <label>Height</label>
                <input type="number" id="newH" value="5">
            </div>

            <button onclick="addElement()" style="margin-top: 10px;">Add Element</button>
        </div>

        <hr style="border-color: #1b263b;">

        <div id="inspector" style="display:none;">
            <h3>Edit Selected Element</h3>
            <input type="hidden" id="editId">
            <label>Name</label>
            <input type="text" id="editName" oninput="updateSelected()">
            <label>X Position</label>
            <input type="number" id="editX" oninput="updateSelected()">
            <label>Y Position</label>
            <input type="number" id="editY" oninput="updateSelected()">
            
            <div id="editDimensionFields">
                <label>Width</label>
                <input type="number" id="editW" oninput="updateSelected()">
                <label>Height</label>
                <input type="number" id="editH" oninput="updateSelected()">
            </div>
            
            <button class="danger" onclick="deleteSelected()" style="margin-top: 10px;">Delete Element</button>
        </div>
        
        <div>
            <p style="font-size: 11px; color: #8d99ae; margin-top: 10px;">
                💡 <b>Instructions:</b><br>
                • Use <b>Edit Layout</b> mode to click and drag departments/assets.<br>
                • Use <b>Pan Map</b> mode to click and drag the canvas background to move around.
            </p>
        </div>
    </div>

    <div id="canvas-container" id="canvasContainer">
        <svg id="layoutSvg" width="1200" height="800">
            <g id="viewport">
                <!-- Grid & Elements rendered dynamically here -->
            </g>
        </svg>
    </div>

<script>
    const gridSize = 20;
    const cols = 60;
    const rows = 40;

    let currentMode = 'edit'; // 'edit' or 'pan'

    // Initial state matching your blueprint photo (Assets as dots, Departments as rects)
    let elements = [
        { id: 1, name: "MAIN RACKING AREA #1", type: "racking", x: 9, y: 6, w: 20, h: 8 },
        { id: 2, name: "RACKING #2", type: "racking", x: 24, y: 11, w: 5, h: 5 },
        { id: 3, name: "MEZZANINE FLOOR", type: "mezzanine", x: 2, y: 15, w: 20, h: 7 },
        { id: 4, name: "Main Distribution Panel MDP-1", type: "asset", x: 4, y: 6 },
        { id: 5, name: "Water Main Shutoff", type: "asset", x: 8, y: 6 }
    ];

    let selectedId = null;
    let isDraggingElement = false;
    let isPanning = false;
    let dragOffset = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let viewTranslate = { x: 50, y: 50 }; // Initial padding offset

    const container = document.getElementById("canvas-container");
    const svg = document.getElementById("layoutSvg");
    const viewport = document.getElementById("viewport");

    svg.setAttribute("width", cols * gridSize + 200);
    svg.setAttribute("height", rows * gridSize + 200);

    function setMode(mode) {
        currentMode = mode;
        document.getElementById("modeEditBtn").classList.toggle("active", mode === 'edit');
        document.getElementById("modePanBtn").classList.toggle("active", mode === 'pan');
        container.style.cursor = mode === 'pan' ? 'grab' : 'default';
        selectedId = null;
        document.getElementById("inspector").style.display = "none";
        render();
    }

    function toggleSizeInputs() {
        let type = document.getElementById("newType").value;
        document.getElementById("dimensionInputs").style.display = (type === 'asset') ? 'none' : 'block';
    }

    function render() {
        viewport.innerHTML = "";
        viewport.setAttribute("transform", `translate(${viewTranslate.x}, ${viewTranslate.y})`);

        // Draw Grid Lines
        for (let c = 0; c <= cols; c++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", c * gridSize);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", c * gridSize);
            line.setAttribute("y2", rows * gridSize);
            line.setAttribute("class", "grid-line");
            viewport.appendChild(line);
        }
        for (let r = 0; r <= rows; r++) {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", 0);
            line.setAttribute("y1", r * gridSize);
            line.setAttribute("x2", cols * gridSize);
            line.setAttribute("y2", r * gridSize);
            line.setAttribute("class", "grid-line");
            viewport.appendChild(line);
        }

        // Draw Yard Zone Border
        let border = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        border.setAttribute("x", gridSize);
        border.setAttribute("y", gridSize);
        border.setAttribute("width", (cols - 2) * gridSize);
        border.setAttribute("height", (rows - 2) * gridSize);
        border.setAttribute("fill", "none");
        border.setAttribute("stroke", "#41c1ff");
        border.setAttribute("stroke-width", "2");
        border.setAttribute("stroke-dasharray", "4");
        viewport.appendChild(border);

        // Draw Elements
        elements.forEach(el => {
            let g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            if (el.type === 'asset') {
                // Render asset as a Dot (Circle)
                let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                let cx = (el.x * gridSize) + (gridSize / 2);
                let cy = (el.y * gridSize) + (gridSize / 2);
                circle.setAttribute("cx", cx);
                circle.setAttribute("cy", cy);
                circle.setAttribute("r", 8);
                circle.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);
                circle.setAttribute("fill", "#e76f51");
                circle.setAttribute("stroke", "#f4a261");
                circle.setAttribute("stroke-width", "2");

                circle.addEventListener("mousedown", (e) => {
                    if (currentMode === 'edit') {
                        e.stopPropagation();
                        startDragElement(e, el);
                    }
                });

                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", cx + 12);
                text.setAttribute("y", cy + 4);
                text.setAttribute("fill", "#fff");
                text.setAttribute("font-size", "11px");
                text.setAttribute("font-weight", "bold");
                text.style.pointerEvents = "none";
                text.textContent = el.name;

                g.appendChild(circle);
                g.appendChild(text);

            } else {
                // Render Department / Racking / Mezzanine as Rectangle
                let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", el.x * gridSize);
                rect.setAttribute("y", el.y * gridSize);
                rect.setAttribute("width", el.w * gridSize);
                rect.setAttribute("height", el.h * gridSize);
                rect.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);

                if (el.type === 'racking') {
                    rect.setAttribute("fill", "#d47a00");
                    rect.setAttribute("fill-opacity", "0.4");
                    rect.setAttribute("stroke", "#ff9f1c");
                } else {
                    rect.setAttribute("fill", "#2b9348");
                    rect.setAttribute("fill-opacity", "0.4");
                    rect.setAttribute("stroke", "#52b788");
                }

                rect.addEventListener("mousedown", (e) => {
                    if (currentMode === 'edit') {
                        e.stopPropagation();
                        startDragElement(e, el);
                    }
                });

                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", (el.x * gridSize) + 6);
                text.setAttribute("y", (el.y * gridSize) + 16);
                text.setAttribute("fill", "#fff");
                text.setAttribute("font-size", "11px");
                text.setAttribute("font-weight", "bold");
                text.style.pointerEvents = "none";
                text.textContent = el.name;

                g.appendChild(rect);
                g.appendChild(text);
            }

            viewport.appendChild(g);
        });
    }

    // Canvas Container Mouse Handlers for Panning or Background Click
    container.addEventListener("mousedown", (e) => {
        if (currentMode === 'pan') {
            isPanning = true;
            container.classList.add("panning");
            panStart = { x: e.clientX - viewTranslate.x, y: e.clientY - viewTranslate.y };
        } else if (currentMode === 'edit') {
            // Clicked background in edit mode -> deselect
            selectedId = null;
            document.getElementById("inspector").style.display = "none";
            render();
        }
    });

    window.addEventListener("mousemove", (e) => {
        if (isPanning) {
            viewTranslate.x = e.clientX - panStart.x;
            viewTranslate.y = e.clientY - panStart.y;
            render();
        }
    });

    window.addEventListener("mouseup", () => {
        if (isPanning) {
            isPanning = false;
            container.classList.remove("panning");
        }
    });

    function startDragElement(e, el) {
        selectedId = el.id;
        isDraggingElement = true;
        
        let mouseX = e.clientX;
        let mouseY = e.clientY;
        
        dragOffset = {
            x: mouseX - ((el.x * gridSize + viewTranslate.x)),
            y: mouseY - ((el.y * gridSize + viewTranslate.y))
        };
        
        populateInspector(el);
        render();

        function onMouseMove(e) {
            if (!isDraggingElement) return;
            let newPxX = e.clientX - dragOffset.x - viewTranslate.x;
            let newPxY = e.clientY - dragOffset.y - viewTranslate.y;
            
            el.x = Math.max(0, Math.min(cols - (el.w || 1), Math.round(newPxX / gridSize)));
            el.y = Math.max(0, Math.min(rows - (el.h || 1), Math.round(newPxY / gridSize)));
            
            populateInspector(el);
            render();
        }

        function onMouseUp() {
            isDraggingElement = false;
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
        }

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
    }

    function populateInspector(el) {
        document.getElementById("inspector").style.display = "block";
        document.getElementById("editId").value = el.id;
        document.getElementById("editName").value = el.name;
        document.getElementById("editX").value = el.x;
        document.getElementById("editY").value = el.y;

        let dimFields = document.getElementById("editDimensionFields");
        if (el.type === 'asset') {
            dimFields.style.display = 'none';
        } else {
            dimFields.style.display = 'block';
            document.getElementById("editW").value = el.w;
            document.getElementById("editH").value = el.h;
        }
    }

    function updateSelected() {
        let id = parseInt(document.getElementById("editId").value);
        let el = elements.find(item => item.id === id);
        if (el) {
            el.name = document.getElementById("editName").value;
            el.x = parseInt(document.getElementById("editX").value) || 0;
            el.y = parseInt(document.getElementById("editY").value) || 0;
            if (el.type !== 'asset') {
                el.w = parseInt(document.getElementById("editW").value) || 1;
                el.h = parseInt(document.getElementById("editH").value) || 1;
            }
            render();
        }
    }

    function addElement() {
        let type = document.getElementById("newType").value;
        let newEl = {
            id: Date.now(),
            name: document.getElementById("newName").value,
            type: type,
            x: parseInt(document.getElementById("newX").value),
            y: parseInt(document.getElementById("newY").value)
        };
        if (type !== 'asset') {
            newEl.w = parseInt(document.getElementById("newW").value) || 4;
            newEl.h = parseInt(document.getElementById("newH").value) || 4;
        }
        elements.push(newEl);
        render();
    }

    function deleteSelected() {
        let id = parseInt(document.getElementById("editId").value);
        elements = elements.filter(item => item.id !== id);
        document.getElementById("inspector").style.display = "none";
        selectedId = null;
        render();
    }

    // Initial render
    render();
</script>

</body>
</html>
