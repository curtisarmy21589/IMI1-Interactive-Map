<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout Builder - Multi-Layer, Photos & Spreadsheet</title>
    <style>
        body {
            background-color: #0b131d;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #111b27;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #1f2d3d;
        }
        h2, h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 15px; }
        label { font-size: 11px; color: #94a3b8; }
        input, select, button, textarea {
            width: 100%;
            padding: 6px 8px;
            background: #0b131d;
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 2px;
            font-size: 12px;
        }
        textarea { resize: vertical; height: 60px; font-family: sans-serif; }
        button {
            background: #1e293b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #38bdf8; color: #0b131d; }
        .mode-btn {
            background: #070d14;
            border: 2px solid #1e293b;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0b131d;
            border-color: #fff;
        }
        .layer-btn {
            flex: 1;
            padding: 6px 4px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        .layer-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            font-weight: bold;
        }
        .danger { background: #7f1d1d; border-color: #ef4444; }
        .danger:hover { background: #ef4444; color: #fff; }
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-color: #38bdf8;
        }
        .panel { display: none; }
        .panel.active { display: flex; flex-direction: column; gap: 8px; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #070d14;
            overflow: hidden;
            cursor: grab;
        }
        #canvas-container.panning { cursor: grabbing; }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        .item-shape {
            cursor: pointer;
            transition: stroke 0.2s;
        }
        .item-shape:hover { stroke: #fff; }
        .item-shape.selected {
            stroke: #fbbf24;
            stroke-width: 3;
        }
        .grid-line {
            stroke: #132235;
            stroke-width: 1;
        }
        .coord-label {
            fill: #64748b;
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
        }
        #coord-display {
            background: #070d14;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            text-align: center;
        }
        #sync-status {
            font-size: 10px;
            text-align: center;
            color: #10b981;
            font-weight: bold;
            margin-top: -4px;
        }

        /* MODAL STYLES */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111b27;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .modal-header {
            background: #0b131d;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2d3d;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-footer {
            background: #0b131d;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #1f2d3d;
        }
        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .close-modal:hover { color: #fff; background: none; }
        
        /* SPREADSHEET TABLE */
        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .spreadsheet-table th, .spreadsheet-table td {
            border: 1px solid #1f2d3d;
            padding: 6px;
            text-align: left;
            font-size: 11px;
        }
        .spreadsheet-table th {
            background: #0b131d;
            color: #38bdf8;
        }
        .spreadsheet-table input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            padding: 2px;
            margin: 0;
        }
        .spreadsheet-table input:focus { outline: 1px solid #38bdf8; }

        /* PHOTO GRID */
        .photo-gallery {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .photo-thumb-container {
            position: relative;
            width: 90px;
            height: 90px;
            border: 1px solid #1f2d3d;
            border-radius: 4px;
            overflow: hidden;
            background: #0b131d;
        }
        .photo-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-photo-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px; height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Layout Builder</h2>
        
        <div id="coord-display">Col: -- | Row: --</div>
        <div id="sync-status">Connected to Firebase</div>

        <!-- LAYER SELECTION MENU -->
        <div>
            <label>Active View Layer</label>
            <div style="display: flex; gap: 4px; margin-top: 2px;">
                <button class="layer-btn active" id="layerGroundBtn" onclick="switchLayer('ground')">Ground Floor</button>
                <button class="layer-btn" id="layerMezzBtn" onclick="switchLayer('mezzanine')">Mezz Floor</button>
                <button class="layer-btn" id="layerRoofBtn" onclick="switchLayer('roof')">Roof Layer</button>
            </div>
        </div>

        <div>
            <label>Interaction Mode</label>
            <div style="display: flex; gap: 6px; margin-top: 2px;">
                <button id="modeEditBtn" class="mode-btn active" onclick="setMode('edit')">Edit Layout</button>
                <button id="modePanBtn" class="mode-btn" onclick="setMode('pan')">Pan / Zoom</button>
            </div>
        </div>

        <hr style="border-color: #1e293b; margin: 4px 0;">

        <!-- Sidebar Tab Switcher -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabDeptBtn" onclick="switchTab('dept')">Departments</button>
            <button class="tab-btn" id="tabAssetBtn" onclick="switchTab('asset')">Assets Menu</button>
        </div>

        <!-- PANEL 1: DEPARTMENTS & RACKING -->
        <div id="panelDept" class="panel active">
            <h3>Department Management</h3>
            <div>
                <label>Add New Item to Current Layer</label>
                <input type="text" id="newDeptName" value="New Zone">
                <select id="newDeptType">
                    <option value="racking">Racking Zone (Rect)</option>
                    <option value="mezzanine">Mezzanine Floor (Rect)</option>
                    <option value="general">General Dept / Roof Unit</option>
                </select>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col (1-30)</label><input type="number" id="newDeptX" value="5"></div>
                    <div style="flex:1;"><label>Y Row (A-N)</label><input type="number" id="newDeptY" value="2"></div>
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="newDeptW" value="5"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="newDeptH" value="4"></div>
                </div>
                <button onclick="addDepartment()" style="margin-top: 6px;">Add to Current Layer</button>
            </div>
        </div>

        <!-- PANEL 2: ASSETS (DOTS) -->
        <div id="panelAsset" class="panel">
            <h3>Utility Assets Menu (Dots)</h3>
            <div>
                <label>Add Asset to Current Layer</label>
                <input type="text" id="newAssetName" value="Emergency Shutoff">
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col (1-30)</label><input type="number" id="newAssetX" value="10"></div>
                    <div style="flex:1;"><label>Y Row (A-N)</label><input type="number" id="newAssetY" value="5"></div>
                </div>
                <button onclick="addAsset()" style="margin-top: 6px;">Add Asset Dot</button>
            </div>
        </div>
        
        <div>
            <p style="font-size: 10px; color: #64748b; margin: 4px 0 0 0;">
                💡 <b>Tip:</b> Click any item on the grid to open its photo gallery and custom spreadsheet records.
            </p>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="layoutSvg" width="1600" height="1000">
            <g id="viewport">
                <!-- Rendered dynamically -->
            </g>
        </svg>
    </div>

    <!-- ITEM DETAILS & PHOTO MODAL -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #38bdf8; margin: 0;">Item Details</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalElementId">
                <div>
                    <label>Item Name / Designation</label>
                    <input type="text" id="modalName" oninput="saveModalLiveChanges()">
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col</label><input type="number" id="modalX" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Y Row</label><input type="number" id="modalY" oninput="saveModalLiveChanges()"></div>
                </div>
                <div id="modalSizeContainer" style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="modalW" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="modalH" oninput="saveModalLiveChanges()"></div>
                </div>

                <div>
                    <label>Location Photos</label>
                    <input type="file" id="photoUploadInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">
                    <div class="photo-gallery" id="modalPhotoGallery">
                        <!-- Uploaded photos render here -->
                    </div>
                </div>

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label>Spreadsheet Details / Custom Records</label>
                        <button onclick="addSpreadsheetRow()" style="width: auto; padding: 2px 8px; font-size: 10px;">+ Add Row</button>
                    </div>
                    <table class="spreadsheet-table">
                        <thead>
                            <tr>
                                <th style="width: 35%;">Parameter / Field</th>
                                <th style="width: 55%;">Value / Data</th>
                                <th style="width: 10%;"></th>
                            </tr>
                        </thead>
                        <tbody id="spreadsheetBody">
                            <!-- Custom rows render here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="danger" onclick="deleteItemFromModal()" style="width: auto; padding: 6px 12px;">Delete Item</button>
                <button onclick="closeModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Done / Save</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrKAut8_5nHWTWtYqZZr5HOENGd8mqZxE",
            authDomain: "imi1-interactive-map-8d929.firebaseapp.com",
            projectId: "imi1-interactive-map-8d929",
            storageBucket: "imi1-interactive-map-8d929.firebasestorage.app",
            messagingSenderId: "613133090515",
            appId: "1:613133090515:web:f8f9be365f484a3a5c5e26",
            measurementId: "G-4QR2RSSTN1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const gridSize = 25;
        const cols = 30; 
        const rows = 14; 

        let currentMode = 'edit'; 
        let currentTab = 'dept'; 
        let currentLayer = 'ground'; 

        // Elements array storing metadata, photos[] and spreadsheetData[]
        let elements = [
            { 
                id: 1, layer: "ground", name: "MAIN RACKING AREA #1", type: "racking", x: 4, y: 2, w: 4, h: 8,
                photos: [], spreadsheetData: [{key: "Bay Count", value: "24 Bays"}, {key: "Weight Capacity", value: "3,500 lbs"}]
            },
            { 
                id: 2, layer: "ground", name: "RACKING #2", type: "racking", x: 18, y: 5, w: 4, h: 4,
                photos: [], spreadsheetData: [{key: "Bay Count", value: "12 Bays"}, {key: "Weight Capacity", value: "2,000 lbs"}]
            },
            { 
                id: 3, layer: "ground", name: "MEZZANINE FLOOR", type: "mezzanine", x: 2, y: 9, w: 10, h: 4,
                photos: [], spreadsheetData: [{key: "Level", value: "Ground Footprint"}]
            },
            { 
                id: 4, layer: "ground", name: "Main Distribution Panel MDP-1", type: "asset", x: 6, y: 3,
                photos: [], spreadsheetData: [{key: "Voltage", value: "480V 3-Phase"}, {key: "Amperage", value: "800A"}]
            },
            { 
                id: 5, layer: "ground", name: "Water Main Shutoff", type: "asset", x: 9, y: 3,
                photos: [], spreadsheetData: [{key: "Valve Type", value: "Quarter-turn Butterfly"}]
            },
            { 
                id: 6, layer: "mezzanine", name: "Mezzanine Level Office & Storage", type: "mezzanine", x: 2, y: 2, w: 12, h: 10,
                photos: [], spreadsheetData: [{key: "Occupancy", value: "Max 15 Personnel"}]
            },
            { 
                id: 7, layer: "roof", name: "Roof HVAC Unit & Solar Array Zone", type: "general", x: 5, y: 3, w: 8, h: 6,
                photos: [], spreadsheetData: [{key: "Unit Model", value: "ICP CA5524VKD3"}]
            }
        ];

        let selectedId = null;
        let isDraggingElement = false;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let viewTransform = { x: 80, y: 80, scale: 1 };

        const container = document.getElementById("canvas-container");
        const svg = document.getElementById("layoutSvg");
        const viewport = document.getElementById("viewport");
        const syncStatus = document.getElementById("sync-status");

        async function loadFromFirebase() {
            try {
                const docRef = doc(db, "layouts", "facility_main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().elements) {
                    elements = docSnap.data().elements;
                    syncStatus.innerText = "Loaded from Firebase";
                } else {
                    await saveToFirebase();
                }
                render();
            } catch (error) {
                console.error("Error loading layout:", error);
                syncStatus.innerText = "Error Loading Database";
                syncStatus.style.color = "#ef4444";
                render();
            }
        }

        async function saveToFirebase() {
            try {
                syncStatus.innerText = "Saving...";
                syncStatus.style.color = "#fbbf24";
                
                await setDoc(doc(db, "layouts", "facility_main"), {
                    elements: elements,
                    updatedAt: new Date().toISOString()
                });
                
                syncStatus.innerText = "Synced to Firebase";
                syncStatus.style.color = "#10b981";
            } catch (error) {
                console.error("Error saving layout:", error);
                syncStatus.innerText = "Sync Failed";
                syncStatus.style.color = "#ef4444";
            }
        }

        function getRowLabel(r) {
            if (r === rows - 2) return "M.9"; 
            let index = r;
            if (index > rows - 2) {
                index -= 1;
            }
            return String.fromCharCode(65 + index); 
        }

        window.switchLayer = function(layerName) {
            currentLayer = layerName;
            document.getElementById("layerGroundBtn").classList.toggle("active", layerName === 'ground');
            document.getElementById("layerMezzBtn").classList.toggle("active", layerName === 'mezzanine');
            document.getElementById("layerRoofBtn").classList.toggle("active", layerName === 'roof');
            selectedId = null;
            render();
        }

        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById("modeEditBtn").classList.toggle("active", mode === 'edit');
            document.getElementById("modePanBtn").classList.toggle("active", mode === 'pan');
            container.style.cursor = mode === 'pan' ? 'grab' : 'default';
            selectedId = null;
            render();
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById("tabDeptBtn").classList.toggle("active", tab === 'dept');
            document.getElementById("tabAssetBtn").classList.toggle("active", tab === 'asset');
            document.getElementById("panelDept").classList.toggle("active", tab === 'dept');
            document.getElementById("panelAsset").classList.toggle("active", tab === 'asset');
        }

        function updateTransformString() {
            viewport.setAttribute("transform", `translate(${viewTransform.x}, ${viewTransform.y}) scale(${viewTransform.scale})`);
        }

        function render() {
            viewport.innerHTML = "";
            updateTransformString();

            // 1. Grid Lines & Labels
            for (let c = 0; c <= cols; c++) {
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", c * gridSize);
                line.setAttribute("y1", 0);
                line.setAttribute("x2", c * gridSize);
                line.setAttribute("y2", rows * gridSize);
                line.setAttribute("class", "grid-line");
                viewport.appendChild(line);

                if (c < cols) {
                    let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", (c * gridSize) + (gridSize / 2));
                    text.setAttribute("y", -8);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("class", "coord-label");
                    text.textContent = c + 1; 
                    viewport.appendChild(text);
                }
            }

            for (let r = 0; r <= rows; r++) {
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 0);
                line.setAttribute("y1", r * gridSize);
                line.setAttribute("x2", cols * gridSize);
                line.setAttribute("y2", r * gridSize);
                
                if (r === rows - 2) {
                    line.setAttribute("stroke", "#f43f5e");
                    line.setAttribute("stroke-dasharray", "2,2");
                } else {
                    line.setAttribute("class", "grid-line");
                }
                viewport.appendChild(line);

                if (r < rows) {
                    let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", -10);
                    text.setAttribute("y", (r * gridSize) + (gridSize / 2) + 3);
                    text.setAttribute("text-anchor", "end");
                    text.setAttribute("class", "coord-label");
                    if (r === rows - 2) {
                        text.setAttribute("fill", "#f43f5e");
                        text.setAttribute("font-weight", "bold");
                    }
                    text.textContent = getRowLabel(r);
                    viewport.appendChild(text);
                }
            }

            // 2. Building Walls
            let buildingWall = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            buildingWall.setAttribute("x", 0);
            buildingWall.setAttribute("y", 0);
            buildingWall.setAttribute("width", cols * gridSize);
            buildingWall.setAttribute("height", rows * gridSize);
            buildingWall.setAttribute("fill", "none");
            buildingWall.setAttribute("stroke", "#38bdf8");
            buildingWall.setAttribute("stroke-width", "2");
            viewport.appendChild(buildingWall);

            let layerTitleName = currentLayer.toUpperCase();
            let topLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            topLabel.setAttribute("x", 0.5 * gridSize);
            topLabel.setAttribute("y", -22);
            topLabel.setAttribute("fill", "#38bdf8");
            topLabel.setAttribute("font-size", "10px");
            topLabel.setAttribute("font-weight", "bold");
            topLabel.textContent = `SOUTH WALL (${layerTitleName} LAYER - ROW A TOP) ▲`;
            viewport.appendChild(topLabel);

            let bottomLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            bottomLabel.setAttribute("x", 0.5 * gridSize);
            bottomLabel.setAttribute("y", (rows * gridSize) + 15);
            bottomLabel.setAttribute("fill", "#38bdf8");
            bottomLabel.setAttribute("font-size", "10px");
            bottomLabel.setAttribute("font-weight", "bold");
            bottomLabel.textContent = `NORTH WALL (${layerTitleName} LAYER - ROW N BOTTOM) ▼`;
            viewport.appendChild(bottomLabel);

            // 3. Render Elements
            let visibleElements = elements.filter(el => (el.layer || 'ground') === currentLayer);

            visibleElements.forEach(el => {
                let g = document.createElementNS("http://www.w3.org/2000/svg", "g");

                if (el.type === 'asset') {
                    let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    let cx = (el.x * gridSize) + (gridSize / 2);
                    let cy = (el.y * gridSize) + (gridSize / 2);
                    circle.setAttribute("cx", cx);
                    circle.setAttribute("cy", cy);
                    circle.setAttribute("r", 7);
                    circle.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);
                    circle.setAttribute("fill", "#f97316");
                    circle.setAttribute("stroke", "#fb923c");
                    circle.setAttribute("stroke-width", "1.5");

                    circle.addEventListener("click", (e) => {
                        if (currentMode === 'edit') {
                            e.stopPropagation();
                            openModal(el);
                        }
                    });
                    
                    circle.addEventListener("mousedown", (e) => {
                        if (currentMode === 'edit') {
                            e.stopPropagation();
                            startDragElement(e, el);
                        }
                    });

                    let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", cx + 10);
                    text.setAttribute("y", cy + 4);
                    text.setAttribute("fill", "#fff");
                    text.setAttribute("font-size", "10px");
                    text.setAttribute("font-weight", "bold");
                    text.style.pointerEvents = "none";
                    text.textContent = el.name;

                    g.appendChild(circle);
                    g.appendChild(text);

                } else {
                    let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", el.x * gridSize);
                    rect.setAttribute("y", el.y * gridSize);
                    rect.setAttribute("width", el.w * gridSize);
                    rect.setAttribute("height", el.h * gridSize);
                    rect.setAttribute("class", `item-shape ${el.id === selectedId ? 'selected' : ''}`);

                    if (el.type === 'racking') {
                        rect.setAttribute("fill", "#d97706");
                        rect.setAttribute("fill-opacity", "0.35");
                        rect.setAttribute("stroke", "#f59e0b");
                    } else if (el.type === 'mezzanine') {
                        rect.setAttribute("fill", "#10b981");
                        rect.setAttribute("fill-opacity", "0.35");
                        rect.setAttribute("stroke", "#34d399");
                    } else {
                        rect.setAttribute("fill", "#0284c7");
                        rect.setAttribute("fill-opacity", "0.35");
                        rect.setAttribute("stroke", "#38bdf8");
                    }
                    rect.setAttribute("stroke-width", "1");

                    rect.addEventListener("click", (e) => {
                        if (currentMode === 'edit') {
                            e.stopPropagation();
                            openModal(el);
                        }
                    });

                    rect.addEventListener("mousedown", (e) => {
                        if (currentMode === 'edit') {
                            e.stopPropagation();
                            startDragElement(e, el);
                        }
                    });

                    let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", (el.x * gridSize) + 6);
                    text.setAttribute("y", (el.y * gridSize) + 16);
                    text.setAttribute("fill", "#fff");
                    text.setAttribute("font-size", "10px");
                    text.setAttribute("font-weight", "bold");
                    text.style.pointerEvents = "none";
                    text.textContent = el.name;

                    g.appendChild(rect);
                    g.appendChild(text);
                }

                viewport.appendChild(g);
            });
        }

        container.addEventListener("mousemove", (e) => {
            let rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            let localX = (mouseX - viewTransform.x) / viewTransform.scale;
            let localY = (mouseY - viewTransform.y) / viewTransform.scale;

            let colIdx = Math.floor(localX / gridSize);
            let rowIdx = Math.floor(localY / gridSize);

            let coordDisplay = document.getElementById("coord-display");
            if (colIdx >= 0 && colIdx < cols && rowIdx >= 0 && rowIdx < rows) {
                let colNum = colIdx + 1;
                let rowLabel = getRowLabel(rowIdx);
                coordDisplay.innerHTML = `Grid: <b>Row ${rowLabel}, Col ${colNum}</b>`;
            } else {
                coordDisplay.innerHTML = `Col: -- | Row: --`;
            }

            if (isPanning) {
                viewTransform.x = e.clientX - panStart.x;
                viewTransform.y = e.clientY - panStart.y;
                render();
            }
        });

        container.addEventListener("wheel", (e) => {
            e.preventDefault();
            let zoomIntensity = 0.1;
            let oldScale = viewTransform.scale;
            
            if (e.deltaY < 0) {
                viewTransform.scale = Math.min(viewTransform.scale * (1 + zoomIntensity), 3.0);
            } else {
                viewTransform.scale = Math.max(viewTransform.scale * (1 - zoomIntensity), 0.3);
            }

            let rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            viewTransform.x = mouseX - (mouseX - viewTransform.x) * (viewTransform.scale / oldScale);
            viewTransform.y = mouseY - (mouseY - viewTransform.y) * (viewTransform.scale / oldScale);

            render();
        }, { passive: false });

        container.addEventListener("mousedown", (e) => {
            if (currentMode === 'pan') {
                isPanning = true;
                container.classList.add("panning");
                panStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
            } else if (currentMode === 'edit') {
                selectedId = null;
                render();
            }
        });

        window.addEventListener("mouseup", () => {
            if (isPanning) {
                isPanning = false;
                container.classList.remove("panning");
            }
        });

        function startDragElement(e, el) {
            selectedId = el.id;
            isDraggingElement = true;
            
            let startX = e.clientX;
            let startY = e.clientY;
            let origX = el.x;
            let origY = el.y;

            function onMouseMove(e) {
                if (!isDraggingElement) return;
                let dx = (e.clientX - startX) / viewTransform.scale;
                let dy = (e.clientY - startY) / viewTransform.scale;
                
                el.x = Math.max(0, Math.min(cols - (el.w || 1), origX + Math.round(dx / gridSize)));
                el.y = Math.max(0, Math.min(rows - (el.h || 1), origY + Math.round(dy / gridSize)));
                
                render();
            }

            function onMouseUp() {
                isDraggingElement = false;
                window.removeEventListener("mousemove", onMouseMove);
                window.removeEventListener("mouseup", onMouseUp);
                saveToFirebase(); 
            }

            window.addEventListener("mousemove", onMouseMove);
            window.addEventListener("mouseup", onMouseUp);
            render();
        }

        // MODAL MANAGEMENT FUNCTIONS
        function openModal(el) {
            selectedId = el.id;
            document.getElementById("modalElementId").value = el.id;
            document.getElementById("modalTitle").innerText = `Edit: ${el.name}`;
            document.getElementById("modalName").value = el.name;
            document.getElementById("modalX").value = el.x;
            document.getElementById("modalY").value = el.y;
            
            if (el.type === 'asset') {
                document.getElementById("modalSizeContainer").style.display = "none";
            } else {
                document.getElementById("modalSizeContainer").style.display = "flex";
                document.getElementById("modalW").value = el.w;
                document.getElementById("modalH").value = el.h;
            }

            renderPhotos(el);
            renderSpreadsheet(el);
            document.getElementById("modal-overlay").style.display = "flex";
            render();
        }

        window.closeModal = function() {
            document.getElementById("modal-overlay").style.display = "none";
            selectedId = null;
            render();
            saveToFirebase();
        }

        window.saveModalLiveChanges = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (el) {
                el.name = document.getElementById("modalName").value;
                el.x = parseInt(document.getElementById("modalX").value) || 0;
                el.y = parseInt(document.getElementById("modalY").value) || 0;
                if (el.type !== 'asset') {
                    el.w = parseInt(document.getElementById("modalW").value) || 1;
                    el.h = parseInt(document.getElementById("modalH").value) || 1;
                }
                document.getElementById("modalTitle").innerText = `Edit: ${el.name}`;
                render();
            }
        }

        // PHOTO UPLOAD HANDLING
        window.handlePhotoUpload = function(event) {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (!el) return;
            if (!el.photos) el.photos = [];

            let files = event.target.files;
            for (let file of files) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    el.photos.push(e.target.result);
                    renderPhotos(el);
                    saveToFirebase();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPhotos(el) {
            let gallery = document.getElementById("modalPhotoGallery");
            gallery.innerHTML = "";
            if (!el.photos) el.photos = [];

            el.photos.forEach((photoUrl, index) => {
                let containerDiv = document.createElement("div");
                containerDiv.className = "photo-thumb-container";
                
                let img = document.createElement("img");
                img.src = photoUrl;
                
                let delBtn = document.createElement("button");
                delBtn.className = "delete-photo-btn";
                delBtn.innerHTML = "×";
                delBtn.onclick = function() {
                    el.photos.splice(index, 1);
                    renderPhotos(el);
                    saveToFirebase();
                };

                containerDiv.appendChild(img);
                containerDiv.appendChild(delBtn);
                gallery.appendChild(containerDiv);
            });
        }

        // SPREADSHEET TABLE HANDLING
        function renderSpreadsheet(el) {
            let tbody = document.getElementById("spreadsheetBody");
            tbody.innerHTML = "";
            if (!el.spreadsheetData) el.spreadsheetData = [];

            el.spreadsheetData.forEach((row, index) => {
                let tr = document.createElement("tr");
                
                let tdKey = document.createElement("td");
                let inputKey = document.createElement("input");
                inputKey.type = "text";
                inputKey.value = row.key;
                inputKey.oninput = function() {
                    row.key = inputKey.value;
                    saveToFirebase();
                };
                tdKey.appendChild(inputKey);

                let tdVal = document.createElement("td");
                let inputVal = document.createElement("input");
                inputVal.type = "text";
                inputVal.value = row.value;
                inputVal.oninput = function() {
                    row.value = inputVal.value;
                    saveToFirebase();
                };
                tdVal.appendChild(inputVal);

                let tdAction = document.createElement("td");
                tdAction.style.textAlign = "center";
                let delRowBtn = document.createElement("button");
                delRowBtn.className = "danger";
                delRowBtn.style.padding = "2px 6px";
                delRowBtn.style.fontSize = "10px";
                delRowBtn.innerText = "X";
                delRowBtn.onclick = function() {
                    el.spreadsheetData.splice(index, 1);
                    renderSpreadsheet(el);
                    saveToFirebase();
                };
                tdAction.appendChild(delRowBtn);

                tr.appendChild(tdKey);
                tr.appendChild(tdVal);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });
        }

        window.addSpreadsheetRow = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (el) {
                if (!el.spreadsheetData) el.spreadsheetData = [];
                el.spreadsheetData.push({ key: "New Field", value: "Value" });
                renderSpreadsheet(el);
                saveToFirebase();
            }
        }

        window.deleteItemFromModal = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            elements = elements.filter(item => item.id !== id);
            closeModal();
        }

        // CREATING NEW ITEMS FROM SIDEBAR
        window.addDepartment = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newDeptName").value,
                type: document.getElementById("newDeptType").value,
                x: parseInt(document.getElementById("newDeptX").value) || 0,
                y: parseInt(document.getElementById("newDeptY").value) || 0,
                w: parseInt(document.getElementById("newDeptW").value) || 3,
                h: parseInt(document.getElementById("newDeptH").value) || 3,
                photos: [],
                spreadsheetData: [{key: "Status", value: "Active"}]
            };
            elements.push(newEl);
            render();
            saveToFirebase();
        }

        window.addAsset = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newAssetName").value,
                type: "asset",
                x: parseInt(document.getElementById("newAssetX").value) || 0,
                y: parseInt(document.getElementById("newAssetY").value) || 0,
                photos: [],
                spreadsheetData: [{key: "Asset Type", value: "Utility Node"}]
            };
            elements.push(newEl);
            render();
            saveToFirebase();
        }

        loadFromFirebase();
    </script>

</body>
