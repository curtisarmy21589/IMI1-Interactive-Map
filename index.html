<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facility Layout & Site Builder - Pan/Zoom Inspect & Spreadsheet</title>
    <style>
        body {
            background-color: #0b131d;
            color: #e0e1dd;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #111b27;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #1f2d3d;
        }
        h2, h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 15px; }
        label { font-size: 11px; color: #94a3b8; }
        input, select, button, textarea {
            width: 100%;
            padding: 6px 8px;
            background: #0b131d;
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 2px;
            font-size: 12px;
        }
        textarea { resize: vertical; height: 60px; font-family: sans-serif; }
        button {
            background: #1e293b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #38bdf8; color: #0b131d; }
        .mode-btn {
            background: #070d14;
            border: 2px solid #1e293b;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0b131d;
            border-color: #fff;
        }
        .layer-btn {
            flex: 1;
            padding: 6px 4px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }
        .layer-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            font-weight: bold;
        }
        .danger { background: #7f1d1d; border-color: #ef4444; }
        .danger:hover { background: #ef4444; color: #fff; }
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px;
            background: #070d14;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-color: #38bdf8;
        }
        .panel { display: none; }
        .panel.active { display: flex; flex-direction: column; gap: 8px; }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #070d14;
            overflow: hidden;
            cursor: grab;
        }
        #canvas-container.panning { cursor: grabbing; }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        .item-group {
            cursor: pointer;
        }
        .item-shape {
            transition: stroke 0.2s;
        }
        .item-group:hover .item-shape { stroke: #fff; }
        .item-shape.selected {
            stroke: #fbbf24;
            stroke-width: 3;
        }
        /* HOVER POPUP BUBBLE STYLES */
        .asset-popup {
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
        }
        .item-group:hover .asset-popup {
            opacity: 1;
        }
        .grid-line {
            stroke: #132235;
            stroke-width: 1;
            pointer-events: none;
        }
        .coord-label {
            fill: #64748b;
            font-size: 9px;
            font-family: monospace;
            pointer-events: none;
        }
        #coord-display {
            background: #070d14;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            text-align: center;
        }
        #sync-status {
            font-size: 10px;
            text-align: center;
            color: #10b981;
            font-weight: bold;
            margin-top: -4px;
        }
        /* MODAL STYLES */
        #modal-overlay, #category-modal-overlay, #lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #lightbox-overlay {
            z-index: 2000;
        }
        .modal-content {
            background: #111b27;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .modal-header {
            background: #0b131d;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2d3d;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-footer {
            background: #0b131d;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #1f2d3d;
        }
        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .close-modal:hover { color: #fff; background: none; }
        
        /* SPREADSHEET TABLE */
        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .spreadsheet-table th, .spreadsheet-table td {
            border: 1px solid #1f2d3d;
            padding: 6px;
            text-align: left;
            font-size: 11px;
        }
        .spreadsheet-table th {
            background: #0b131d;
            color: #38bdf8;
        }
        .spreadsheet-table input, .spreadsheet-table select {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            padding: 2px;
            margin: 0;
        }
        .spreadsheet-table input:focus, .spreadsheet-table select:focus { outline: 1px solid #38bdf8; }
        /* PHOTO GRID */
        .photo-gallery {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .photo-thumb-container {
            position: relative;
            width: 90px;
            height: 90px;
            border: 1px solid #1f2d3d;
            border-radius: 4px;
            overflow: hidden;
            background: #0b131d;
            cursor: pointer;
        }
        .photo-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .photo-thumb-container:hover img {
            transform: scale(1.05);
        }
        .delete-photo-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Site & Layout Builder</h2>
        
        <div id="coord-display">Col: -- | Row: --</div>
        <div id="sync-status">Connected to Firebase</div>
        <!-- LAYER SELECTION MENU -->
        <div>
            <label>Active View Layer</label>
            <div style="display: flex; gap: 4px; margin-top: 2px;">
                <button class="layer-btn active" id="layerGroundBtn" onclick="switchLayer('ground')">Ground Floor</button>
                <button class="layer-btn" id="layerMezzBtn" onclick="switchLayer('mezzanine')">Mezz Floor</button>
                <button class="layer-btn" id="layerRoofBtn" onclick="switchLayer('roof')">Roof Layer</button>
            </div>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="layer-btn" id="layerSprinklerBtn" onclick="switchLayer('sprinkler')">Sprinkler Shutoffs</button>
                <button class="layer-btn" id="layerWaterBtn" onclick="switchLayer('water')">Water Shutoffs</button>
                <button class="layer-btn" id="layerGasBtn" onclick="switchLayer('gas')">Gas Shutoffs</button>
            </div>
        </div>
        <div>
            <label>Interaction Mode</label>
            <div style="display: flex; gap: 6px; margin-top: 2px;">
                <button id="modeEditBtn" class="mode-btn active" onclick="setMode('edit')">Edit Layout (Drag)</button>
                <button id="modePanBtn" class="mode-btn" onclick="setMode('pan')">Pan / Zoom & Inspect</button>
            </div>
        </div>
        <hr style="border-color: #1e293b; margin: 4px 0;">
        <!-- Sidebar Tab Switcher -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabDeptBtn" onclick="switchTab('dept')">Zones & Yard</button>
            <button class="tab-btn" id="tabAssetBtn" onclick="switchTab('asset')">Assets Menu</button>
        </div>
        <!-- PANEL 1: DEPARTMENTS & ZONES -->
        <div id="panelDept" class="panel active">
            <h3>Zone / Yard Management</h3>
            <div>
                <label>Add New Zone / Yard Area</label>
                <input type="text" id="newDeptName" value="North Yard Area">
                <select id="newDeptType">
                    <option value="yard">External Yard / Grading (Rect)</option>
                    <option value="racking">Racking Zone (Rect)</option>
                    <option value="mezzanine">Mezzanine Floor (Rect)</option>
                    <option value="general">General Dept / Roof Unit</option>
                </select>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col (-6 to 34)</label><input type="number" id="newDeptX" step="0.5" value="2"></div>
                    <div style="flex:1;"><label>Y Row (-4 to 18)</label><input type="number" id="newDeptY" step="0.5" value="-4"></div>
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="newDeptW" step="0.5" value="12"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="newDeptH" step="0.5" value="5"></div>
                </div>
                <button onclick="addDepartment()" style="margin-top: 6px;">Add Zone to Map</button>
            </div>
        </div>
        <!-- PANEL 2: ASSETS (DOTS) -->
        <div id="panelAsset" class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Utility & Fire Assets</h3>
                <button onclick="openCategoryModal()" style="width: auto; padding: 2px 6px; font-size: 10px; background: #1e293b; color: #38bdf8;">⚙️ Categories</button>
            </div>
            <div>
                <label>Asset Name</label>
                <input type="text" id="newAssetName" value="Fire Hydrant #1">
                <label>Category</label>
                <select id="newAssetCategory">
                    <!-- Populated dynamically -->
                </select>
                <label>Dot Icon (Emoji)</label>
                <input type="text" id="newAssetEmoji" value="🧯" style="text-align: center; font-size: 16px;">
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <div style="flex:1;"><label>X Col (-6 to 34)</label><input type="number" id="newAssetX" step="0.25" value="5"></div>
                    <div style="flex:1;"><label>Y Row (-4 to 18)</label><input type="number" id="newAssetY" step="0.25" value="-2"></div>
                </div>
                <button onclick="addAsset()" style="margin-top: 6px;">Add Fire/Utility Asset</button>
            </div>
        </div>
        
        <div>
            <p style="font-size: 10px; color: #64748b; margin: 4px 0 0 0;">
                💡 <b>Tip:</b> Hover over asset icons to preview names. Click photos to view them full size.
            </p>
        </div>
    </div>
    <div id="canvas-container">
        <svg id="layoutSvg" width="2200" height="1400">
            <g id="viewport">
                <!-- Rendered dynamically -->
            </g>
        </svg>
    </div>
    <!-- ITEM DETAILS & PHOTO MODAL -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #38bdf8; margin: 0;">Item Details</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalElementId">
                
                <div>
                    <label>Item Name / Designation</label>
                    <input type="text" id="modalName" oninput="saveModalLiveChanges()">
                </div>
                <!-- Asset-Specific Fields (Category & Emoji) -->
                <div id="modalAssetFields" style="display: flex; gap: 6px;">
                    <div style="flex: 3;">
                        <label>Asset Category</label>
                        <select id="modalCategory" onchange="saveModalLiveChanges()">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>Dot Emoji</label>
                        <input type="text" id="modalEmoji" oninput="saveModalLiveChanges()" style="text-align: center; font-size: 16px;">
                    </div>
                </div>
                <div style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>X Col</label><input type="number" id="modalX" step="0.25" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Y Row</label><input type="number" id="modalY" step="0.25" oninput="saveModalLiveChanges()"></div>
                </div>
                
                <div id="modalSizeContainer" style="display: flex; gap: 6px;">
                    <div style="flex:1;"><label>Width</label><input type="number" id="modalW" step="0.25" oninput="saveModalLiveChanges()"></div>
                    <div style="flex:1;"><label>Height</label><input type="number" id="modalH" step="0.25" oninput="saveModalLiveChanges()"></div>
                </div>
                <div>
                    <label>Location Photos (Click photo to enlarge) <span id="upload-status" style="color: #38bdf8; font-weight: normal;"></span></label>
                    <input type="file" id="photoUploadInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">
                    <div class="photo-gallery" id="modalPhotoGallery">
                        <!-- Uploaded photos render here -->
                    </div>
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label>Spreadsheet Details / Custom Records</label>
                        <button onclick="addSpreadsheetRow()" style="width: auto; padding: 2px 8px; font-size: 10px;">+ Add Row</button>
                    </div>
                    <table class="spreadsheet-table">
                        <thead>
                            <tr>
                                <th style="width: 35%;">Parameter / Field</th>
                                <th style="width: 55%;">Value / Data</th>
                                <th style="width: 10%;"></th>
                            </tr>
                        </thead>
                        <tbody id="spreadsheetBody">
                            <!-- Custom rows render here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="danger" onclick="deleteItemFromModal()" style="width: auto; padding: 6px 12px;">Delete Item</button>
                <button onclick="closeModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Done / Save</button>
            </div>
        </div>
    </div>
    <!-- FULL-SIZE PHOTO LIGHTBOX OVERLAY -->
    <div id="lightbox-overlay" onclick="closeLightbox()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" style="position: absolute; top: -35px; right: 0; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">×</button>
            <img id="lightboxImage" src="" style="max-width: 85vw; max-height: 80vh; object-fit: contain; border-radius: 4px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
            <div id="lightboxCaption" style="margin-top: 8px; color: #38bdf8; font-size: 13px; font-weight: bold;"></div>
        </div>
    </div>
    <!-- CATEGORY MANAGER MODAL -->
    <div id="category-modal-overlay">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h3 style="color: #38bdf8; margin: 0;">Manage Asset Categories</h3>
                <button class="close-modal" onclick="closeCategoryModal()">×</button>
            </div>
            <div class="modal-body">
                <div>
                    <label>Add New Category</label>
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <input type="text" id="newCatName" placeholder="Category Name (e.g. Water Main)" style="flex: 2;">
                        <input type="color" id="newCatColor" value="#38bdf8" style="flex: 0.5; height: 30px; padding: 0; cursor: pointer;">
                        <button onclick="addCategory()" style="flex: 1; margin-top: 0;">Add Category</button>
                    </div>
                </div>
                <div style="margin-top: 8px;">
                    <label>Existing Categories & Accent Colors</label>
                    <table class="spreadsheet-table" style="margin-top: 6px;">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th style="width: 70px; text-align: center;">Color</th>
                                <th style="width: 50px; text-align: center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeCategoryModal()" style="width: auto; padding: 6px 12px; background: #38bdf8; color: #0b131d;">Save & Close</button>
            </div>
        </div>
    </div>
    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCrKAut8_5nHWTWtYqZZr5HOENGd8mqZxE",
            authDomain: "imi1-interactive-map-8d929.firebaseapp.com",
            projectId: "imi1-interactive-map-8d929",
            storageBucket: "imi1-interactive-map-8d929.firebasestorage.app",
            messagingSenderId: "613133090515",
            appId: "1:613133090515:web:f8f9be365f484a3a5c5e26",
            measurementId: "G-4QR2RSSTN1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gridSize = 25;
        const minCol = -8;
        const maxCol = 38;
        const minRow = -6;
        const maxRow = 20;
        const buildingCols = 30; 
        const buildingRows = 14; 
        let currentMode = 'edit'; 
        let currentTab = 'dept'; 
        let currentLayer = 'ground'; 
        // Default categories with custom accent colors
        let categories = [
            { name: "Fire Safety", color: "#ef4444" },
            { name: "Electrical", color: "#f97316" },
            { name: "Plumbing", color: "#38bdf8" },
            { name: "Safety", color: "#fbbf24" },
            { name: "HVAC", color: "#34d399" },
            { name: "General", color: "#94a3b8" }
        ];
        let elements = [
            { 
                id: 101, layer: "ground", name: "North Yard Fire Hydrant #1", type: "asset", category: "Fire Safety", emoji: "", x: 4, y: -3,
                photos: [], spreadsheetData: [{key: "Flow Rate", value: "1,500 GPM"}, {key: "Inspection", value: "Passed Q2"}]
            },
            { 
                id: 102, layer: "ground", name: "North Yard Fire Hydrant #2", type: "asset", category: "Fire Safety", emoji: "🧯", x: 22, y: -3,
                photos: [], spreadsheetData: [{key: "Flow Rate", value: "1,500 GPM"}, {key: "Inspection", value: "Passed Q2"}]
            },
            { 
                id: 103, layer: "ground", name: "East Retention Pond #1", type: "yard", x: 31, y: -4, w: 6, h: 6,
                photos: [], spreadsheetData: [{key: "Capacity", value: "1.2 Million Gal"}]
            },
            { 
                id: 104, layer: "ground", name: "North Truck Yard & Trailer Parking", type: "yard", x: 2, y: -5, w: 26, h: 4,
                photos: [], spreadsheetData: [{key: "Stall Count", value: "45 Trailer Docks"}]
            },
            { 
                id: 1, layer: "ground", name: "MAIN RACKING AREA #1", type: "racking", x: 4, y: 2, w: 4, h: 8,
                photos: [], spreadsheetData: [{key: "Bay Count", value: "24 Bays"}, {key: "Weight Capacity", value: "3,500 lbs"}]
            },
            { 
                id: 2, layer: "ground", name: "RACKING #2", type: "racking", x: 18, y: 5, w: 4, h: 4,
                photos: [], spreadsheetData: [{key: "Bay Count", value: "12 Bays"}, {key: "Weight Capacity", value: "2,000 lbs"}]
            },
            { 
                id: 3, layer: "ground", name: "MEZZANINE FLOOR", type: "mezzanine", x: 2, y: 9, w: 10, h: 4,

            },
            {

                photos: [], spreadsheetData: [{key: "Voltage", value: "480V 3-Phase"}, {key: "Amperage", value: "800A"}]
            },
            { 
                id: 5, layer: "ground", name: "Water Main Shutoff", type: "asset", category: "Plumbing", emoji: "🚰", x: 9, y: 3,

            },
            { 
                id: 6, layer: "mezzanine", name: "Mezzanine Level Office & Storage", type: "mezzanine", x: 2, y: 2, w: 12, h: 10,

            },
            {

                photos: [], spreadsheetData: [{key: "Unit Model", value: "ICP CA5524VKD3"}]
            }
        ];
        let selectedId = null;
        let isDraggingElement = false;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let viewTransform = { x: 250, y: 180, scale: 0.9 };
        const container = document.getElementById("canvas-container");
        const svg = document.getElementById("layoutSvg");
        const viewport = document.getElementById("viewport");
        const syncStatus = document.getElementById("sync-status");
        async function loadFromFirebase() {
            try {
                const docRef = doc(db, "layouts", "facility_main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (data.elements) elements = data.elements;
                    if (data.categories) categories = data.categories;
                    syncStatus.innerText = "Loaded from Firebase";
                } else {
                    await saveToFirebase();
                }
                populateCategoryDropdowns();
                render();
            } catch (error) {
                console.error("Error loading layout:", error);
                syncStatus.innerText = "Error Loading Database";
                syncStatus.style.color = "#ef4444";
                populateCategoryDropdowns();
                render();
            }
        }
        async function saveToFirebase() {
            try {
                syncStatus.innerText = "Saving...";
                syncStatus.style.color = "#fbbf24";
                
                await setDoc(doc(db, "layouts", "facility_main"), {
                    elements: elements,

        container.addEventListener("mousemove", (e) => {
            let rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;
            let localX = (mouseX - viewTransform.x) / viewTransform.scale;
            let localY = (mouseY - viewTransform.y) / viewTransform.scale;
            let coordDisplay = document.getElementById("coord-display");
            let exactCol = localX / gridSize;
            let rowIdx = Math.floor(localY / gridSize);
            let preciseColNum = (exactCol + 1).toFixed(2);
            let rowLabel = getRowLabel(rowIdx);
            
            coordDisplay.innerHTML = `Grid: <b>Row ${rowLabel}, Col ${preciseColNum}</b>`;
            if (isPanning) {
                viewTransform.x = e.clientX - panStart.x;
                viewTransform.y = e.clientY - panStart.y;
                render();
            }
        });
        container.addEventListener("wheel", (e) => {
            e.preventDefault();
            let zoomIntensity = 0.1;
            let oldScale = viewTransform.scale;
            
            if (e.deltaY < 0) {
                viewTransform.scale = Math.min(viewTransform.scale * (1 + zoomIntensity), 3.0);
            } else {
                viewTransform.scale = Math.max(viewTransform.scale * (1 - zoomIntensity), 0.3);
            }
            let rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;
            viewTransform.x = mouseX - (mouseX - viewTransform.x) * (viewTransform.scale / oldScale);
            viewTransform.y = mouseY - (mouseY - viewTransform.y) * (viewTransform.scale / oldScale);
            render();
        }, { passive: false });
        container.addEventListener("mousedown", (e) => {
            if (currentMode === 'pan') {
                isPanning = true;
                container.classList.add("panning");
                panStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
            } else if (currentMode === 'edit') {
                selectedId = null;
                render();
            }
        });
        window.addEventListener("mouseup", () => {
            if (isPanning) {
                isPanning = false;
                container.classList.remove("panning");
            }
        });
        function startDragElement(e, el) {
            selectedId = el.id;
            isDraggingElement = true;
            
            let startX = e.clientX;
            let startY = e.clientY;
            let origX = el.x;
            let origY = el.y;
            function onMouseMove(e) {
                if (!isDraggingElement) return;
                let dx = (e.clientX - startX) / viewTransform.scale;
                let dy = (e.clientY - startY) / viewTransform.scale;
                
                el.x = parseFloat((origX + (dx / gridSize)).toFixed(2));
                el.y = parseFloat((origY + (dy / gridSize)).toFixed(2));
                
                render();
            }
            function onMouseUp() {
                isDraggingElement = false;
                window.removeEventListener("mousemove", onMouseMove);
                window.removeEventListener("mouseup", onMouseUp);
                saveToFirebase(); 
            }
            window.addEventListener("mousemove", onMouseMove);
            window.addEventListener("mouseup", onMouseUp);
            render();
        }

        // CLOUDFLARE R2 PHOTO UPLOAD & LIGHTBOX HANDLING
        window.handlePhotoUpload = async function(event) {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (!el) return;
            if (!el.photos) el.photos = [];
            
            let files = event.target.files;
            let statusSpan = document.getElementById("upload-status");
            
            for (let file of files) {
                try {
                    statusSpan.innerText = `(Uploading ${file.name} to R2...)`;
                    let formData = new FormData();
                    formData.append("file", file);
                    
                    let response = await fetch("https://imi1-map-uploader.curtisarmy21589.workers.dev", {
                        method: "POST",
                        body: formData
                    });
                    
                    if (!response.ok) throw new Error("Upload failed");
                    
                    let result = await response.json();
                    let photoUrl = result.url || result.fileUrl || (typeof result === 'string' ? result : null);
                    
                    if (!photoUrl) {
                        // Fallback if response is plain text
                        let textRes = await response.text();
                        photoUrl = textRes;
                    }
                    
                    if (photoUrl) {
                        el.photos.push(photoUrl);
                        renderPhotos(el);
                        saveToFirebase();
                    }
                } catch (error) {
                    console.error("Error uploading to Cloudflare R2:", error);
                    alert("Failed to upload photo to Cloudflare R2.");
                }
            }
            statusSpan.innerText = "";
            event.target.value = ""; // Reset file input
        }

        }
        window.deleteItemFromModal = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            if (confirm("Are you sure you want to delete this item?")) {
                elements = elements.filter(item => item.id !== id);
                closeModal();
                saveToFirebase();
            }
        }
        // CREATING NEW ITEMS FROM SIDEBAR
        window.addDepartment = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newDeptName").value,
                type: document.getElementById("newDeptType").value,
                x: parseFloat(document.getElementById("newDeptX").value) || 0,
                y: parseFloat(document.getElementById("newDeptY").value) || 0,
                w: parseFloat(document.getElementById("newDeptW").value) || 5,
                h: parseFloat(document.getElementById("newDeptH").value) || 5,
                photos: [],
                spreadsheetData: [{key: "Status", value: "Active"}]
            };
            elements.push(newEl);
            render();
            saveToFirebase();
        }
        window.addAsset = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newAssetName").value,
                type: "asset",
                category: document.getElementById("newAssetCategory").value,
                emoji: document.getElementById("newAssetEmoji").value || "🧯",
                x: parseFloat(document.getElementById("newAssetX").value) || 0,
                y: parseFloat(document.getElementById("newAssetY").value) || 0,
                photos: [],
                spreadsheetData: [{key: "Asset Type", value: "Safety/Fire Node"}]
            };
            elements.push(newEl);
            render();
            saveToFirebase();
        }
        loadFromFirebase();
    </script>
</body>
</html>
