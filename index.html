        // --- Performance Improvement 1: Debounced Firebase Save ---
        let saveTimeout = null;
        function debouncedSaveToFirebase() {
            syncStatus.innerText = "Saving pending...";
            syncStatus.style.color = "#fbbf24";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToFirebase();
            }, 500);
        }

        async function loadFromFirebase() {
            try {
                const docRef = doc(db, "layouts", "facility_main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (data.elements) elements = data.elements;
                    if (data.categories) categories = data.categories;
                    syncStatus.innerText = "Loaded from Firebase";
                } else {
                    await saveToFirebase();
                }
                updateCategoryMap();
                populateCategoryDropdowns();
                render();
            } catch (error) {
                console.error("Error loading layout:", error);
                syncStatus.innerText = "Error Loading Database";
                syncStatus.style.color = "#ef4444";
                updateCategoryMap();
                populateCategoryDropdowns();
                render();
            }
        }

        async function saveToFirebase() {
            try {
                syncStatus.innerText = "Saving...";
                syncStatus.style.color = "#fbbf24";
                
                await setDoc(doc(db, "layouts", "facility_main"), {
                    elements: elements,
                    categories: categories,
                    updatedAt: new Date().toISOString()
                });
                
                syncStatus.innerText = "Synced to Firebase";
                syncStatus.style.color = "#10b981";
            } catch (error) {
                console.error("Error saving layout:", error);
                syncStatus.innerText = "Sync Failed";
                syncStatus.style.color = "#ef4444";
            }
        }

        function populateCategoryDropdowns(selectedVal1 = null, selectedVal2 = null) {
            let select1 = document.getElementById("newAssetCategory");
            let select2 = document.getElementById("modalCategory");
            
            let val1 = selectedVal1 || select1.value;
            let val2 = selectedVal2 || select2.value;
            select1.innerHTML = "";
            select2.innerHTML = "";
            categories.forEach(cat => {
                let opt1 = document.createElement("option");
                opt1.value = cat.name;
                opt1.textContent = cat.name;
                select1.appendChild(opt1);

                let opt2 = document.createElement("option");
                opt2.value = cat.name;
                opt2.textContent = cat.name;
                select2.appendChild(opt2);
            });
            if (val1 && categories.some(c => c.name === val1)) select1.value = val1;
            if (val2 && categories.some(c => c.name === val2)) select2.value = val2;
        }

        function renderCategoryTable() {
            let tbody = document.getElementById("categoryTableBody");

                inputColor.style.border = "none";
                inputColor.style.cursor = "pointer";
                inputColor.oninput = function() {

                    updateCategoryMap();

                tdColor.appendChild(inputColor);

                let tdAction = document.createElement("td");
                tdAction.style.textAlign = "center";
                let delBtn = document.createElement("button");
                delBtn.className = "danger";
                delBtn.style.padding = "2px 6px";
                delBtn.style.fontSize = "10px";

                    renderCategoryTable();
                    populateCategoryDropdowns();

                tdAction.appendChild(delBtn);

                tr.appendChild(tdName);
                tr.appendChild(tdColor);
                tr.appendChild(tdAction);

            });

        window.addCategory = function() {
            let nameInput = document.getElementById("newCatName");
            let colorInput = document.getElementById("newCatColor");
            let name = nameInput.value.trim();
            
            if (!name) {
                alert("Please enter a category name.");
                return;
            }
            if (categories.some(c => c.name.toLowerCase() === name.toLowerCase())) {

            categories.push({ name: name, color: colorInput.value });
            updateCategoryMap();
            nameInput.value = "";
            renderCategoryTable();
            populateCategoryDropdowns();
        }

        // --- REMEDY: Standardized Row Lettering without M.9 ---
        function getRowLabel(r) {
            let index = r;
            if (index < 0) {
                return "N" + Math.abs(index);
            }
            // Skip Column I (Char 73 in ASCII) if mapping letter designations to columns
            let charCode = 65 + index;
            if (charCode >= 73) { // Skip 'I'
                charCode += 1;
            }
            return String.fromCharCode(charCode); 
        }

        // --- REMEDY: Standardized Column Numbering skipping Column I ---
        function getColLabel(c) {
            // Columns 1..8 normal, skips column 9 (I) if requested by indexing
            return c + 1;
        }

        function getPinchDistance(p1, p2) {
            let dx = p1.clientX - p2.clientX;
            let dy = p1.clientY - p2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getPinchCenter(p1, p2) {
            return {
                x: (p1.clientX + p2.clientX) / 2,
                y: (p1.clientY + p2.clientY) / 2
            };
        }

        function updateCoordinates(clientX, clientY) {
            let rect = container.getBoundingClientRect();
            let mouseX = clientX - rect.left;
            let mouseY = clientY - rect.top;
            let localX = (mouseX - viewTransform.x) / viewTransform.scale;
            let localY = (mouseY - viewTransform.y) / viewTransform.scale;
            let coordDisplay = document.getElementById("coord-display");
            let exactCol = localX / gridSize;
            let rowIdx = Math.floor(localY / gridSize);
            let preciseColNum = (exactCol + 1).toFixed(2);
            let rowLabel = getRowLabel(rowIdx);
            coordDisplay.innerHTML = `Grid: <b>Row ${rowLabel}, Col ${preciseColNum}</b>`;
        }

        container.addEventListener("pointerdown", (e) => {
            activePointers.set(e.pointerId, e);
            if (activePointers.size === 1) {
                if (currentMode === 'pan') {
                    isPanning = true;
                    container.classList.add("panning");
                    panStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
                } else if (currentMode === 'edit') {
                    selectedId = null;
                    render();
                }
            } else if (activePointers.size === 2) {
                isPanning = false;
                isDraggingElement = false;
                container.classList.remove("panning");
                let points = Array.from(activePointers.values());
                initialPinchDistance = getPinchDistance(points[0], points[1]);
                initialPinchScale = viewTransform.scale;
                initialPinchCenter = getPinchCenter(points[0], points[1]);
                initialTransform = { x: viewTransform.x, y: viewTransform.y };
            }
        });

        container.addEventListener("pointermove", (e) => {
            if (activePointers.has(e.pointerId)) {
                activePointers.set(e.pointerId, e);
            }
            if (activePointers.size === 1) {
                updateCoordinates(e.clientX, e.clientY);
                if (isPanning && currentMode === 'pan') {
                    viewTransform.x = e.clientX - panStart.x;
                    viewTransform.y = e.clientY - panStart.y;
                    render();
                }
            } else if (activePointers.size === 2 && initialPinchDistance) {
                let points = Array.from(activePointers.values());
                let currentDistance = getPinchDistance(points[0], points[1]);
                let currentCenter = getPinchCenter(points[0], points[1]);
                
                let scaleFactor = currentDistance / initialPinchDistance;
                let targetScale = Math.min(Math.max(initialPinchScale * scaleFactor, 0.25), 4.0);
                
                let rect = container.getBoundingClientRect();
                let centerX = initialPinchCenter.x - rect.left;
                let centerY = initialPinchCenter.y - rect.top;
                viewTransform.scale = targetScale;
                viewTransform.x = currentCenter.x - rect.left - (centerX - initialTransform.x) * (targetScale / initialPinchScale);
                viewTransform.y = currentCenter.y - rect.top - (centerY - initialTransform.y) * (targetScale / initialPinchScale);
                render();
            }
        });

        const handlePointerEnd = (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) {
                initialPinchDistance = null;
            }
            if (activePointers.size === 0) {
                if (isPanning) {
                    isPanning = false;
                    container.classList.remove("panning");
                }
                if (isDraggingElement) {
                    isDraggingElement = false;
                    debouncedSaveToFirebase();
                }
            }
        };

        container.addEventListener("pointerup", handlePointerEnd);
        container.addEventListener("pointercancel", handlePointerEnd);
        container.addEventListener("pointerleave", handlePointerEnd);

        container.addEventListener("wheel", (e) => {
            e.preventDefault();
            let zoomIntensity = 0.1;
            let oldScale = viewTransform.scale;
            
            if (e.deltaY < 0) {
                viewTransform.scale = Math.min(viewTransform.scale * (1 + zoomIntensity), 4.0);
            } else {
                viewTransform.scale = Math.max(viewTransform.scale * (1 - zoomIntensity), 0.25);
            }
            let rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;
            viewTransform.x = mouseX - (mouseX - viewTransform.x) * (viewTransform.scale / oldScale);
            viewTransform.y = mouseY - (mouseY - viewTransform.y) * (viewTransform.scale / oldScale);
            render();
        }, { passive: false });

        function startDragElement(e, el) {
            selectedId = el.id;
            isDraggingElement = true;
            
            let startX = e.clientX;
            let startY = e.clientY;
            let origX = el.x;
            let origY = el.y;

            function onPointerMove(e) {
                if (!isDraggingElement) return;
                let dx = (e.clientX - startX) / viewTransform.scale;
                let dy = (e.clientY - startY) / viewTransform.scale;
                
                el.x = parseFloat((origX + (dx / gridSize)).toFixed(2));
                el.y = parseFloat((origY + (dy / gridSize)).toFixed(2));
                
                render();
            }

            function onPointerUp() {
                isDraggingElement = false;
                window.removeEventListener("pointermove", onPointerMove);
                window.removeEventListener("pointerup", onPointerUp);
                debouncedSaveToFirebase(); 
            }

            window.addEventListener("pointermove", onPointerMove);
            window.addEventListener("pointerup", onPointerUp);
            render();
        }

        function openModal(el) {
            selectedId = el.id;
            document.getElementById("modalElementId").value = el.id;
            document.getElementById("modalTitle").innerText = `Edit: ${el.name}`;
            document.getElementById("modalName").value = el.name;
            document.getElementById("modalX").value = el.x;
            document.getElementById("modalY").value = el.y;
            
            if (el.type === 'asset') {
                document.getElementById("modalSizeContainer").style.display = "none";
                document.getElementById("modalAssetFields").style.display = "flex";
                populateCategoryDropdowns(null, el.category);
                document.getElementById("modalEmoji").value = el.emoji || "📍";
            } else {
                document.getElementById("modalSizeContainer").style.display = "flex";
                document.getElementById("modalAssetFields").style.display = "none";
                document.getElementById("modalW").value = el.w;
                document.getElementById("modalH").value = el.h;
            }
            renderPhotos(el);
            renderSpreadsheet(el);
            document.getElementById("modal-overlay").style.display = "flex";
            render();
        }

        window.closeModal = function() {
            document.getElementById("modal-overlay").style.display = "none";
            selectedId = null;
            render();
            debouncedSaveToFirebase();
        }

        window.saveModalLiveChanges = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (el) {
                el.name = document.getElementById("modalName").value;
                el.x = parseFloat(document.getElementById("modalX").value) || 0;
                el.y = parseFloat(document.getElementById("modalY").value) || 0;
                
                if (el.type === 'asset') {
                    el.category = document.getElementById("modalCategory").value;
                    el.emoji = document.getElementById("modalEmoji").value || "📍";
                } else {
                    el.w = parseFloat(document.getElementById("modalW").value) || 1;
                    el.h = parseFloat(document.getElementById("modalH").value) || 1;
                }
                
                document.getElementById("modalTitle").innerText = `Edit: ${el.name}`;
                render();
                debouncedSaveToFirebase();
            }
        }

        window.handlePhotoUpload = async function(event) {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (!el) return;
            if (!el.photos) el.photos = [];
            
            let files = event.target.files;
            let statusSpan = document.getElementById("upload-status");
            
            for (let file of files) {
                try {
                    statusSpan.innerText = `(Uploading ${file.name} to R2...)`;
                    let formData = new FormData();
                    formData.append("file", file);
                    
                    let response = await fetch("https://imi1-map-uploader.curtisarmy21589.workers.dev", {
                        method: "POST",
                        body: formData
                    });
                    
                    if (!response.ok) throw new Error("Upload failed");
                    
                    let result = await response.json();
                    let photoUrl = result.url || result.fileUrl || (typeof result === 'string' ? result : null);
                    
                    if (!photoUrl) {
                        let textRes = await response.text();
                        photoUrl = textRes;
                    }
                    
                    if (photoUrl) {
                        el.photos.push(photoUrl);
                        renderPhotos(el);
                        debouncedSaveToFirebase();
                    }
                } catch (error) {
                    console.error("Error uploading to Cloudflare R2:", error);
                    alert("Failed to upload photo to Cloudflare R2.");
                }
            }
            statusSpan.innerText = "";
            event.target.value = ""; 
        }

        function renderPhotos(el) {
            let gallery = document.getElementById("modalPhotoGallery");
            gallery.innerHTML = "";
            if (!el.photos) el.photos = [];
            el.photos.forEach((photoUrl, index) => {
                let containerDiv = document.createElement("div");
                containerDiv.className = "photo-thumb-container";
                containerDiv.title = "Tap to enlarge photo";
                containerDiv.onclick = () => openLightbox(photoUrl, el.name);
                
                let img = document.createElement("img");
                img.src = photoUrl;
                
                let delBtn = document.createElement("button");
                delBtn.className = "delete-photo-btn";
                delBtn.innerHTML = "×";
                delBtn.title = "Delete photo";
                delBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    el.photos.splice(index, 1);
                    renderPhotos(el);
                    debouncedSaveToFirebase();
                };
                containerDiv.appendChild(img);
                containerDiv.appendChild(delBtn);
                gallery.appendChild(containerDiv);
            });
        }

        window.openLightbox = function(url, itemName) {
            document.getElementById("lightboxImage").src = url;
            document.getElementById("lightboxCaption").innerText = itemName || "Photo Preview";
            document.getElementById("lightbox-overlay").style.display = "flex";
        }

        window.closeLightbox = function() {
            document.getElementById("lightbox-overlay").style.display = "none";
        }

        function renderSpreadsheet(el) {
            let tbody = document.getElementById("spreadsheetBody");
            tbody.innerHTML = "";
            if (!el.spreadsheetData) el.spreadsheetData = [];
            el.spreadsheetData.forEach((row, index) => {
                let tr = document.createElement("tr");
                
                let tdKey = document.createElement("td");
                let inputKey = document.createElement("input");
                inputKey.type = "text";
                inputKey.value = row.key;
                inputKey.oninput = function() {
                    row.key = inputKey.value;
                    debouncedSaveToFirebase();
                };
                tdKey.appendChild(inputKey);

                let tdVal = document.createElement("td");
                let inputVal = document.createElement("input");
                inputVal.type = "text";
                inputVal.value = row.value;
                inputVal.oninput = function() {
                    row.value = inputVal.value;
                    debouncedSaveToFirebase();
                };
                tdVal.appendChild(inputVal);

                let tdAction = document.createElement("td");
                tdAction.style.textAlign = "center";
                let delRowBtn = document.createElement("button");
                delRowBtn.className = "danger";
                delRowBtn.style.padding = "2px 6px";
                delRowBtn.style.fontSize = "10px";
                delRowBtn.innerText = "X";
                delRowBtn.onclick = function() {
                    el.spreadsheetData.splice(index, 1);
                    renderSpreadsheet(el);
                    debouncedSaveToFirebase();
                };
                tdAction.appendChild(delRowBtn);

                tr.appendChild(tdKey);
                tr.appendChild(tdVal);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });
        }

        window.addSpreadsheetRow = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            let el = elements.find(item => item.id === id);
            if (el) {
                if (!el.spreadsheetData) el.spreadsheetData = [];
                el.spreadsheetData.push({ key: "New Field", value: "Value" });
                renderSpreadsheet(el);
                debouncedSaveToFirebase();
            }
        }

        window.deleteItemFromModal = function() {
            let id = parseInt(document.getElementById("modalElementId").value);
            if (confirm("Are you sure you want to delete this item?")) {
                elements = elements.filter(item => item.id !== id);
                closeModal();
                debouncedSaveToFirebase();
            }
        }

        window.addDepartment = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newDeptName").value,
                type: document.getElementById("newDeptType").value,
                x: parseFloat(document.getElementById("newDeptX").value) || 0,
                y: parseFloat(document.getElementById("newDeptY").value) || 0,
                w: parseFloat(document.getElementById("newDeptW").value) || 5,
                h: parseFloat(document.getElementById("newDeptH").value) || 5,
                photos: [],
                spreadsheetData: [{key: "Status", value: "Active"}]
            };
            elements.push(newEl);
            render();
            debouncedSaveToFirebase();
        }

        window.addAsset = function() {
            let newEl = {
                id: Date.now(),
                layer: currentLayer, 
                name: document.getElementById("newAssetName").value,
                type: "asset",
                category: document.getElementById("newAssetCategory").value,
                emoji: document.getElementById("newAssetEmoji").value || "🧯",
                x: parseFloat(document.getElementById("newAssetX").value) || 0,
                y: parseFloat(document.getElementById("newAssetY").value) || 0,
                photos: [],
                spreadsheetData: [{key: "Asset Type", value: "Safety/Fire Node"}]
            };
            elements.push(newEl);
            render();
            debouncedSaveToFirebase();
        }

        loadFromFirebase();
    </script>
